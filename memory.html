<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0e16" />
  <meta name="description" content="记忆翻牌 —— 找出小站主题的八对图案，挑战最少步数。" />
  <title>记忆翻牌 | CCCAD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧠%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="subpage.css?v=120" />
  <link rel="stylesheet" href="theme.css?v=119" />
  <link rel="stylesheet" href="search.css?v=116" />  <link rel="manifest" href="manifest.json?v=116" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <script src="theme.js?v=119"></script>
  <script src="search.js?v=116"></script>
  <script src="leaderboard.js?v=116"></script>
  <style>
    .hud {
      display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;
      margin-bottom: 22px;
    }
    .hud div {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 18px; text-align: center; font-family: var(--mono);
    }
    .hud b { display: block; font-size: 1.2rem; color: var(--accent); font-variant-numeric: tabular-nums; }
    .hud span { font-size: .68rem; color: var(--muted); }

    .mode-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 18px; }
    .mode-row button {
      background: var(--card); border: 1px solid var(--border); border-radius: 999px;
      color: var(--muted); font-family: inherit; font-size: .8rem;
      padding: 7px 18px; cursor: pointer; transition: all .2s;
    }
    .mode-row button.on { color: #06251a; background: var(--gradient); border-color: transparent; font-weight: 700; }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 480px;
      margin: 0 auto 22px;
    }
    .card {
      perspective: 700px; background: none; border: none; padding: 0;
      cursor: pointer; aspect-ratio: 3 / 3.4; font-family: inherit;
    }
    .card .inner {
      position: relative; width: 100%; height: 100%;
      transition: transform .45s cubic-bezier(.2, .8, .3, 1.1);
      transform-style: preserve-3d;
    }
    .card.flip .inner, .card.done .inner { transform: rotateY(180deg); }
    .face {
      position: absolute; inset: 0;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
    }
    .face.back {
      background:
        linear-gradient(135deg, rgba(0, 229, 160, .16), rgba(56, 189, 248, .10)),
        repeating-linear-gradient(0deg, transparent 0 7px, rgba(255, 255, 255, .04) 7px 8px),
        repeating-linear-gradient(90deg, transparent 0 7px, rgba(255, 255, 255, .04) 7px 8px),
        var(--panel);
      border: 1px solid var(--border-hover);
      box-shadow: inset 0 0 20px rgba(0, 229, 160, .12), 0 4px 14px rgba(0, 0, 0, .35);
      font-size: 1.35rem; color: var(--accent);
      text-shadow: 0 0 12px rgba(0, 229, 160, .8);
    }
    .card:hover .face.back {
      border-color: var(--accent);
      box-shadow: inset 0 0 28px rgba(0, 229, 160, .2), 0 6px 18px rgba(0, 0, 0, .4);
    }
    .face.front {
      background: linear-gradient(160deg, var(--card), var(--panel));
      border: 1px solid var(--border);
      box-shadow: inset 0 0 18px rgba(0, 0, 0, .4);
      transform: rotateY(180deg);
      font-size: 2.1rem;
      text-shadow: 0 3px 10px rgba(0, 0, 0, .45);
    }
    .card.done { cursor: default; }
    .card.done .face.front {
      border-color: var(--acc-soft-bd);
      background: var(--acc-soft-bg);
      box-shadow: 0 0 16px rgba(0, 229, 160, .2);
    }
    .card.mismatch .face.front { border-color: rgba(255, 132, 132, .5); animation: shake .3s; }
    @keyframes shake {
      0%, 100% { transform: rotateY(180deg) translateX(0); }
      25% { transform: rotateY(180deg) translateX(-4px); }
      75% { transform: rotateY(180deg) translateX(4px); }
    }

    .win-panel {
      display: none;
      background: linear-gradient(120deg, rgba(0, 229, 160, .14), rgba(56, 189, 248, .10));
      border: 1px solid var(--border-hover);
      border-radius: var(--radius);
      padding: 26px;
      text-align: center;
      max-width: 480px;
      margin: 0 auto;
    }
    .win-panel.show { display: block; }
    .win-panel h2 { margin-bottom: 8px; }
    .win-panel p { color: var(--muted); font-size: .88rem; margin-bottom: 16px; }
    .record { color: var(--accent); font-family: var(--mono); font-size: .8rem; }

    /* 全站排名 */
    .lb-panel { max-width: 480px; margin: 0 auto 16px; text-align: left; }
    .lb-head { font-family: var(--mono); font-size: .74rem; color: var(--muted); margin-bottom: 8px; }
    .lb-row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-bottom: 1px dashed var(--border); font-family: var(--mono); font-size: .74rem; }
    .lb-row.first { background: var(--acc-soft-bg); border-radius: 6px; }
    .lb-row .rk { width: 20px; color: var(--accent); }
    .lb-row .nm { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-row .sc { color: var(--accent); }
    .lb-row .dt { color: var(--muted); font-size: .62rem; }
    .lb-submit { display: none; align-items: center; gap: 8px; margin: 12px 0 4px; flex-wrap: wrap; }
    .lb-submit.show { display: flex; }
    .lb-submit input {
      flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: inherit; font-size: .8rem; padding: 8px 10px; outline: none;
    }
    .lb-submit input:focus { border-color: var(--border-hover); }
    .lb-ok { color: var(--accent); font-family: var(--mono); font-size: .78rem; }
  </style>
</head>
<body>

  <div class="top">
    <a class="back" href="index.html">← 返回首页</a>
    <span class="badge">🧠 memory</span>
  </div>

  <h1 data-word="MEMORY">记忆 <span class="grad">翻牌</span></h1>

  <div class="wrap">
    <div class="mode-row">
      <button type="button" data-m="easy" class="on">🙂 简单 4×4</button>
      <button type="button" data-m="hard">🔥 困难 6×6</button>
    </div>
    <div class="hud">
      <div><b id="mMoves">0</b><span>步数</span></div>
      <div><b id="mTime">0s</b><span>用时</span></div>
      <div><b id="mPair">0/8</b><span>已配对</span></div>
      <div><b id="mBest">--</b><span>最佳纪录</span></div>
    </div>

    <div class="board" id="board"></div>

    <div class="win-panel" id="winPanel">
      <h2>🎉 全部配对！</h2>
      <p id="winText"></p>
      <span class="record" id="winRecord"></span>
      <div class="lb-submit" id="mLb">
        <input type="text" id="mLbName" maxlength="10" placeholder="昵称（10 字内）" />
        <button class="tbtn" id="mLbGo" type="button">🏆 上榜</button>
      </div>
      <div class="row" style="justify-content:center; margin-top:16px">
        <button class="tbtn" id="mRestart">🔄 再来一局</button>
      </div>
    </div>

    <div class="lb-panel" id="memoryLb"></div>

    <p class="caption">翻开两张相同的图案即配对成功 · 用最少步数挑战自己 · 纪录保存在本机</p>
  </div>

  <script>
    const $ = (s, el = document) => el.querySelector(s);
    const EMO = ["🚲", "🐟", "💬", "🎨", "🧰", "📊", "🤖", "🎓", "🚀", "🎮", "📶", "📈", "🧠", "⚙️", "🌟", "☕", "🌙", "⚡"];
    const MODES = { easy: { pairs: 8, cols: 4 }, hard: { pairs: 18, cols: 6 } };
    let mode = "easy";
    const BKEY = () => "memory-best-" + mode;
    let first = null, lock = false, moves = 0, matched = 0, t0 = 0, timer = null;

    function fmtTime(s) { return s < 60 ? s + "s" : Math.floor(s / 60) + "分" + (s % 60) + "s"; }

    function shuffle(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function draw() {
      first = null; lock = false; moves = 0; matched = 0; t0 = 0;
      clearInterval(timer);
      const cfg = MODES[mode];
      $("#mMoves").textContent = "0";
      $("#mTime").textContent = "0s";
      $("#mPair").textContent = "0/" + cfg.pairs;
      $("#winPanel").classList.remove("show");
      $("#board").style.gridTemplateColumns = "repeat(" + cfg.cols + ", 1fr)";
      $("#board").style.maxWidth = mode === "hard" ? "640px" : "480px";
      const base = EMO.slice(0, cfg.pairs);
      const deck = shuffle([...base, ...base]);
      $("#board").innerHTML = deck.map((e, i) =>
        `<button class="card" data-e="${e}" data-i="${i}" type="button" aria-label="翻牌">
           <div class="inner">
             <div class="face back">✦</div>
             <div class="face front">${e}</div>
           </div>
         </button>`).join("");
      [...$("#board").children].forEach((c) => c.addEventListener("click", () => flip(c)));
      const best = jget(BKEY(), null);
      $("#mBest").textContent = best ? best.moves + "步/" + best.secs + "s" : "--";
      document.querySelectorAll(".mode-row button").forEach((b) =>
        b.classList.toggle("on", b.dataset.m === mode));
    }

    function jget(k, fb) {
      try { return JSON.parse(localStorage.getItem(k) || fb); } catch (e) { return fb; }
    }

    function flip(card) {
      if (lock || card.classList.contains("flip") || card.classList.contains("done")) return;
      if (!t0) {
        t0 = Date.now();
        timer = setInterval(() => { $("#mTime").textContent = fmtTime(Math.floor((Date.now() - t0) / 1000)); }, 500);
      }
      card.classList.add("flip");
      if (!first) { first = card; return; }

      moves++;
      $("#mMoves").textContent = moves;
      const a = first, b = card;
      first = null;

      if (a.dataset.e === b.dataset.e) {
        a.classList.add("done"); b.classList.add("done");
        a.classList.remove("flip"); b.classList.remove("flip");
        matched++;
        $("#mPair").textContent = matched + "/" + MODES[mode].pairs;
        if (matched === 8) win();
      } else {
        lock = true;
        a.classList.add("mismatch"); b.classList.add("mismatch");
        setTimeout(() => {
          a.classList.remove("flip", "mismatch");
          b.classList.remove("flip", "mismatch");
          lock = false;
        }, 700);
      }
    }

    function win() {
      clearInterval(timer);
      const secs = Math.floor((Date.now() - t0) / 1000);
      $("#mTime").textContent = fmtTime(secs);
      const best = jget(BKEY(), null);
      const isRecord = !best || moves < best.moves || (moves === best.moves && secs < best.secs);
      if (isRecord) {
        try { localStorage.setItem(BKEY(), JSON.stringify({ moves, secs })); } catch (e) {}
        $("#mBest").textContent = moves + "步/" + secs + "s";
      }
      $("#winText").textContent = moves + " 步 · " + fmtTime(secs) + " 完成 —— " +
        (moves <= 10 ? "记忆超群 🧠" : moves <= 14 ? "发挥稳健 👍" : "重在参与 😄");
      $("#winRecord").textContent = isRecord ? "🌟 新纪录！" : "最佳纪录：" + best.moves + " 步 / " + fmtTime(best.secs);
      const lb = $("#mLb");
      lb.classList.add("show");
      $("#mLbName").value = LB.getName();
      $("#winPanel").classList.add("show");
    }

    document.getElementById("mRestart").addEventListener("click", draw);
    document.querySelectorAll(".mode-row button").forEach((b) =>
      b.addEventListener("click", () => { mode = b.dataset.m; draw(); }));

    /* 🏆 全站排名（步数升序） */
    LB.render("memory", "#memoryLb", "步");
    $("#mLbGo").addEventListener("click", async () => {
      const btn = $("#mLbGo");
      btn.disabled = true;
      try {
        const name = $("#mLbName").value;
        LB.saveName(name);
        const res = await LB.submit("memory", name, moves);
        $("#mLb").innerHTML = '<span class="lb-ok">🏆 已上榜 · 第 ' + res.rank + ' 名 ✓</span>';
        LB.render("memory", "#memoryLb", "步");
      } catch (e) {
        btn.disabled = false;
        btn.textContent = "失败 · 重试";
      }
    });
    document.addEventListener("DOMContentLoaded", draw);
  </script>
</body>
</html>
