<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0e16" />
  <meta name="description" content="贪吃蛇 —— 方向键 / WASD / 触屏操控，吃鱼长大，挑战最高分。" />
  <title>贪吃蛇 | CCCAD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐍%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="subpage.css?v=112" />
  <link rel="stylesheet" href="theme.css?v=112" />
  <link rel="stylesheet" href="search.css?v=112" />
  <script src="theme.js?v=112"></script>
  <script src="search.js?v=112"></script>
  <script src="leaderboard.js?v=112"></script>
  <style>
    .hud {
      display: flex; justify-content: center; gap: 14px; flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .hud div {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 20px; text-align: center; font-family: var(--mono);
    }
    .hud b { display: block; font-size: 1.25rem; color: var(--accent); font-variant-numeric: tabular-nums; }
    .hud span { font-size: .68rem; color: var(--muted); }

    .stage { position: relative; max-width: 420px; margin: 0 auto 16px; }
    canvas {
      display: block; width: 100%; height: auto;
      background: var(--panel);
      border: 1px solid var(--border); border-radius: 12px;
      touch-action: none;
    }
    .over {
      position: absolute; inset: 0;
      display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px;
      background: rgba(10, 14, 22, .82); border-radius: 12px;
      text-align: center; backdrop-filter: blur(2px);
    }
    .over.show { display: flex; }
    .over h2 { font-size: 1.3rem; }
    .over p { color: var(--muted); font-size: .86rem; }

    .dpad {
      display: none;
      grid-template-columns: repeat(3, 64px);
      gap: 8px; justify-content: center;
      margin: 0 auto 16px;
    }
    .dpad button {
      height: 52px; border-radius: 10px;
      background: var(--card); border: 1px solid var(--border-hover);
      color: var(--accent); font-size: 1.1rem; cursor: pointer;
    }
    .dpad button:active { background: var(--acc-soft-bg); }
    @media (pointer: coarse) { .dpad { display: grid; } }

    .sp-hint { text-align: center; font-size: .74rem; color: var(--muted); font-family: var(--mono); }

    /* 全站排名 */
    .lb-panel { max-width: 420px; margin: 0 auto 16px; text-align: left; }
    .lb-head { font-family: var(--mono); font-size: .74rem; color: var(--muted); margin-bottom: 8px; }
    .lb-row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-bottom: 1px dashed var(--border); font-family: var(--mono); font-size: .74rem; }
    .lb-row.first { background: var(--acc-soft-bg); border-radius: 6px; }
    .lb-row .rk { width: 20px; color: var(--accent); }
    .lb-row .nm { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-row .sc { color: var(--accent); }
    .lb-row .dt { color: var(--muted); font-size: .62rem; }
    .lb-submit { display: none; align-items: center; gap: 8px; margin: 12px 0; }
    .lb-submit.show { display: flex; }
    .lb-submit input {
      flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: inherit; font-size: .8rem; padding: 8px 10px; outline: none;
    }
    .lb-submit input:focus { border-color: var(--border-hover); }
    .lb-ok { color: var(--accent); font-family: var(--mono); font-size: .78rem; }
  </style>
</head>
<body>

  <div class="top">
    <a class="back" href="index.html">← 返回首页</a>
    <span class="badge">🐍 snake</span>
  </div>

  <h1>贪吃 <span class="grad">蛇</span></h1>

  <div class="wrap">
    <div class="hud">
      <div><b id="sScore">0</b><span>分数</span></div>
      <div><b id="sLen">3</b><span>长度</span></div>
      <div><b id="sBest">0</b><span>最佳</span></div>
    </div>

    <div class="stage">
      <canvas id="snk" width="420" height="420"></canvas>
      <div class="over" id="sOver">
        <h2>💀 游戏结束</h2>
        <p id="sFinal"></p>
        <div class="lb-submit" id="sLb">
          <input type="text" id="sLbName" maxlength="10" placeholder="昵称（10 字内）" />
          <button class="tbtn" id="sLbGo" type="button">🏆 上榜</button>
        </div>
        <button class="tbtn" id="sAgain">🔄 再来一局</button>
      </div>
      <div class="over" id="sStart">
        <h2>🐍 准备好了吗？</h2>
        <p>按 方向键 / WASD 开始 · 触屏滑动也可以</p>
      </div>
    </div>

    <div class="lb-panel" id="snakeLb"></div>

    <div class="dpad" aria-label="方向控制">
      <span></span>
      <button type="button" data-d="up">▲</button>
      <span></span>
      <button type="button" data-d="left">◀</button>
      <button type="button" data-d="down">▼</button>
      <button type="button" data-d="right">▶</button>
    </div>

    <p class="sp-hint">方向键 / WASD 移动 · 空格暂停 · 吃 🐟 长大，越吃越快</p>
  </div>

  <script>
    const $ = (s, el = document) => el.querySelector(s);
    const CS = 20, N = 21; /* 21×21 格，每格 20px */
    const cv = $("#snk"), ctx = cv.getContext("2d");
    let snake, dir, nextDir, food, score, speed, timer = null, paused = false, dead = true, running = false;
    let best = 0;
    try { best = Number(localStorage.getItem("snake-best")) || 0; } catch (e) {}
    $("#sBest").textContent = best;

    function spawnFood() {
      do {
        food = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
      } while (snake.some((s) => s.x === food.x && s.y === food.y));
    }

    function draw() {
      ctx.fillStyle = "rgba(0, 229, 160, .04)";
      for (let x = 0; x < N; x++)
        for (let y = 0; y < N; y++)
          if ((x + y) % 2 === 0) ctx.fillRect(x * CS, y * CS, CS, CS);
      /* 食物 */
      ctx.font = "15px serif";
      ctx.textBaseline = "middle";
      ctx.textAlign = "center";
      ctx.fillText("🐟", food.x * CS + CS / 2, food.y * CS + CS / 2 + 1);
      /* 蛇 */
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? "#00e5a0" : "rgba(56, 189, 248, " + (0.85 - i * 0.03) + ")";
        ctx.beginPath();
        ctx.roundRect(s.x * CS + 2, s.y * CS + 2, CS - 4, CS - 4, 5);
        ctx.fill();
      });
    }

    function tick() {
      if (paused || dead || !running) return;
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
          snake.some((s) => s.x === head.x && s.y === head.y)) return die();
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        $("#sScore").textContent = score;
        $("#sLen").textContent = snake.length;
        spawnFood();
        if (score % 50 === 0 && speed > 70) {
          speed -= 8;
          clearInterval(timer);
          timer = setInterval(tick, speed);
        }
      } else snake.pop();
      draw();
    }

    function setDir(d) {
      const map = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
      const nd = map[d];
      if (!nd || (nd.x === -dir.x && nd.y === -dir.y)) return; /* 禁止原地掉头 */
      nextDir = nd;
      beginRun();
    }

    function start() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = nextDir = { x: 1, y: 0 };
      score = 0; speed = 140; dead = false; paused = false; running = false;
      $("#sScore").textContent = "0";
      $("#sLen").textContent = "3";
      $("#sOver").classList.remove("show");
      $("#sStart").classList.add("show");
      spawnFood();
      draw();
      clearInterval(timer);
    }

    /* 首次按方向键才真正开跑 */
    function beginRun() {
      if (dead || running) return;
      running = true;
      $("#sStart").classList.remove("show");
      clearInterval(timer);
      timer = setInterval(tick, speed);
    }

    function die() {
      dead = true;
      running = false;
      clearInterval(timer);
      $("#sStart").classList.remove("show");
      if (score > best) {
        best = score;
        $("#sBest").textContent = best;
        try { localStorage.setItem("snake-best", String(best)); } catch (e) {}
      }
      $("#sFinal").textContent = "本局 " + score + " 分 · 蛇长 " + snake.length + " · 最佳 " + best;
      const lb = $("#sLb");
      if (score > 0) {
        lb.classList.add("show");
        $("#sLbName").value = LB.getName();
      } else {
        lb.classList.remove("show");
      }
      $("#sOver").classList.add("show");
    }

    document.addEventListener("keydown", (e) => {
      const K = e.key.toLowerCase();
      if (["arrowup", "w"].includes(K)) { setDir("up"); e.preventDefault(); }
      else if (["arrowdown", "s"].includes(K)) { setDir("down"); e.preventDefault(); }
      else if (["arrowleft", "a"].includes(K)) { setDir("left"); e.preventDefault(); }
      else if (["arrowright", "d"].includes(K)) { setDir("right"); e.preventDefault(); }
      else if (K === " " && !dead) { paused = !paused; e.preventDefault(); }
      else if (K === "enter" && dead) start();
    });

    document.querySelectorAll(".dpad button").forEach((b) =>
      b.addEventListener("click", () => setDir(b.dataset.d)));

    /* 触屏滑动 */
    let ts = null;
    cv.addEventListener("touchstart", (e) => { ts = e.touches[0]; }, { passive: true });
    cv.addEventListener("touchend", (e) => {
      if (!ts) return;
      const dx = e.changedTouches[0].clientX - ts.clientX;
      const dy = e.changedTouches[0].clientY - ts.clientY;
      if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
      setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
      ts = null;
    }, { passive: true });

    $("#sAgain").addEventListener("click", start);

    /* 🏆 全站排名 */
    LB.render("snake", "#snakeLb", "分");
    $("#sLbGo").addEventListener("click", async () => {
      const btn = $("#sLbGo");
      btn.disabled = true;
      try {
        const name = $("#sLbName").value;
        LB.saveName(name);
        const res = await LB.submit("snake", name, score);
        $("#sLb").innerHTML = '<span class="lb-ok">🏆 已上榜 · 第 ' + res.rank + ' 名 ✓</span>';
        LB.render("snake", "#snakeLb", "分");
      } catch (e) {
        btn.disabled = false;
        btn.textContent = "失败 · 重试";
      }
    });

    start();
  </script>
</body>
</html>
