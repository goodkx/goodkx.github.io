<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0e16" />
  <meta name="description" content="工具箱 —— 一组开箱即用的浏览器小工具。" />
  <title>工具箱 | CCCAD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧰%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="subpage.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="search.css" />
  <script src="theme.js"></script>
  <script src="search.js"></script>
  <style>
    .tools {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    .tool {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      transition: border-color .3s, box-shadow .3s;
      scroll-margin-top: 20px;
    }
    .tool:hover {
      border-color: var(--border-hover);
      box-shadow: 0 12px 32px rgba(0, 0, 0, .3), 0 0 24px rgba(0, 229, 160, .06);
    }
    .tool h3 { font-size: 1rem; margin-bottom: 14px; }

    textarea {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--mono);
      font-size: .84rem;
      line-height: 1.7;
      padding: 10px 12px;
      resize: vertical;
      margin-bottom: 12px;
    }
    textarea:focus { outline: none; border-color: var(--border-hover); }

    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
    .row:last-child { margin-bottom: 0; }
    .row label { font-size: .82rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }

    input[type="number"], input[type="text"], select {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--mono);
      font-size: .86rem;
      padding: 8px 10px;
    }
    input[type="number"] { width: 96px; }
    input[type="text"] { flex: 1; min-width: 120px; }
    input[type="number"]:focus, input[type="text"]:focus, select:focus { outline: none; border-color: var(--border-hover); }
    select { cursor: pointer; }

    input[type="color"] {
      width: 46px; height: 34px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      padding: 2px;
      cursor: pointer;
    }
    .swatch {
      width: 34px; height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .tbtn {
      background: var(--gradient);
      color: #06251a;
      border: none;
      border-radius: 8px;
      font-size: .84rem;
      font-weight: 600;
      font-family: inherit;
      padding: 9px 16px;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }
    .tbtn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0, 229, 160, .3); }
    .tbtn.ghost {
      background: transparent;
      color: var(--accent);
      border: 1px solid rgba(0, 229, 160, .5);
    }
    .tbtn.ghost:hover { box-shadow: none; background: var(--acc-soft-bg); }

    .out {
      display: block;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--accent-2);
      font-family: var(--mono);
      font-size: .82rem;
      line-height: 1.7;
      padding: 10px 12px;
      min-height: 40px;
      word-break: break-all;
      white-space: pre-wrap;
    }
    .out.err { color: #ff8484; }
    .out mark { background: rgba(251, 191, 36, .35); color: inherit; border-radius: 3px; padding: 0 1px; }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      text-align: center;
    }
    .stat-row b {
      display: block;
      font-family: var(--mono);
      font-size: 1.35rem;
      color: var(--accent);
    }
    .stat-row span { font-size: .72rem; color: var(--muted); }

    .hint { font-size: .74rem; color: var(--muted); font-family: var(--mono); }
    .hint code { color: var(--accent-2); }

    /* 考研倒计时 */
    .cd-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      text-align: center;
      margin-bottom: 12px;
    }
    .cd-grid div { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 4px; }
    .cd-grid b { display: block; font-family: var(--mono); font-size: 1.7rem; color: var(--accent); font-variant-numeric: tabular-nums; }
    .cd-grid span { font-size: .7rem; color: var(--muted); }

    @media (max-width: 860px) { .tools { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <div class="top">
    <a class="back" href="index.html">← 返回首页</a>
    <span class="badge">🧰 toolbox</span>
  </div>

  <h1>好用的 <span class="grad">小工具</span></h1>

  <div class="wrap tools">

    <section class="tool reveal" id="tc">
      <h3>🔤 字数统计</h3>
      <textarea id="tcIn" rows="4" placeholder="在此粘贴或输入文本……"></textarea>
      <div class="stat-row">
        <div><b id="tcChars">0</b><span>字符</span></div>
        <div><b id="tcWords">0</b><span>词数</span></div>
        <div><b id="tcLines">0</b><span>行数</span></div>
      </div>
    </section>

    <section class="tool reveal" style="--d:.05s" id="ts">
      <h3>⏱️ 时间戳转换</h3>
      <div class="row">
        <input type="number" id="tsIn" placeholder="1770000000" />
        <button class="tbtn" id="tsGo">转换为日期</button>
      </div>
      <output class="out" id="tsOut">—</output>
      <p class="hint">当前秒级时间戳：<code id="tsNow">—</code></p>
    </section>

    <section class="tool reveal" style="--d:.1s" id="col">
      <h3>🎨 颜色转换</h3>
      <div class="row">
        <input type="color" id="colIn" value="#00e5a0" />
        <div class="swatch" id="colSw"></div>
      </div>
      <output class="out" id="colOut">—</output>
    </section>

    <section class="tool reveal" style="--d:.15s" id="pw">
      <h3>🔐 密码生成</h3>
      <div class="row">
        <label>长度 <input type="number" id="pwLen" value="16" min="6" max="64" /></label>
        <button class="tbtn" id="pwGo">生成</button>
        <button class="tbtn ghost" id="pwCopy">复制</button>
      </div>
      <output class="out" id="pwOut">—</output>
    </section>

    <section class="tool reveal" style="--d:.2s" id="b64">
      <h3>🔁 Base64 编解码</h3>
      <textarea id="b64In" rows="3" placeholder="输入要编码 / 解码的内容"></textarea>
      <div class="row">
        <button class="tbtn" id="b64Enc">编码 →</button>
        <button class="tbtn" id="b64Dec">← 解码</button>
      </div>
      <output class="out" id="b64Out">—</output>
    </section>

    <section class="tool reveal" style="--d:.25s" id="json">
      <h3>🧾 JSON 格式化</h3>
      <textarea id="jsonIn" rows="3" placeholder='{"hello":"world"}'></textarea>
      <div class="row"><button class="tbtn" id="jsonGo">格式化</button></div>
      <pre class="out" id="jsonOut">—</pre>
    </section>

    <section class="tool reveal" style="--d:.3s" id="cd">
      <h3>🎯 考研倒计时</h3>
      <div class="cd-grid">
        <div><b id="cdD">—</b><span>天</span></div>
        <div><b id="cdH">—</b><span>时</span></div>
        <div><b id="cdM">—</b><span>分</span></div>
        <div><b id="cdS">—</b><span>秒</span></div>
      </div>
      <p class="hint" id="cdMsg">—</p>
    </section>

    <section class="tool reveal" style="--d:.35s" id="radix">
      <h3>🔢 进制转换</h3>
      <div class="row">
        <input type="text" id="rdIn" placeholder="输入数字，如 255" />
        <select id="rdBase">
          <option value="10" selected>十进制</option>
          <option value="2">二进制</option>
          <option value="8">八进制</option>
          <option value="16">十六进制</option>
        </select>
      </div>
      <output class="out" id="rdOut">—</output>
    </section>

    <section class="tool reveal" style="--d:.4s" id="regex">
      <h3>🔍 正则测试</h3>
      <div class="row">
        <input type="text" id="rxPat" placeholder="正则表达式，如 \d{2,}" />
        <input type="text" id="rxFlags" value="g" placeholder="标志" style="flex:none; width:70px" />
      </div>
      <textarea id="rxText" rows="3" placeholder="在此输入测试文本……"></textarea>
      <output class="out" id="rxOut">输入正则与文本后自动匹配</output>
    </section>

  </div>

  <p class="caption">
    全部 <b>纯前端本地运行</b>，数据不出浏览器 ｜
    想加新工具？复制一个 <b>&lt;section class="tool"&gt;</b> 加一段函数即可
  </p>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const $  = (s, el = document) => el.querySelector(s);
    const $$ = (s, el = document) => [...el.querySelectorAll(s)];
    let toastTimer = null;
    function showToast(msg) {
      const toast = $("#toast");
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
    }
    function initReveal() {
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) { e.target.classList.add("visible"); io.unobserve(e.target); }
        });
      }, { threshold: 0.1 });
      $$(".reveal").forEach((el) => io.observe(el));
    }
    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast("已复制到剪贴板 ✓");
      } catch {
        showToast("复制失败，请手动选择复制");
      }
    }

    /* ── 字数统计 ── */
    function initCharCount() {
      const el = $("#tcIn");
      el.addEventListener("input", () => {
        const v = el.value;
        $("#tcChars").textContent = [...v].length;
        const cjk = (v.match(/[\u4e00-\u9fff]/g) || []).length;
        const en  = (v.match(/[a-zA-Z0-9]+/g) || []).length;
        $("#tcWords").textContent = cjk + en;
        $("#tcLines").textContent = v === "" ? 0 : v.split("\n").length;
      });
    }

    /* ── 时间戳转换 ── */
    function initTimestamp() {
      const out = $("#tsOut");
      $("#tsGo").addEventListener("click", () => {
        const v = Number($("#tsIn").value);
        if (!Number.isFinite(v) || $("#tsIn").value === "") {
          out.textContent = "请先输入时间戳";
          return;
        }
        const d = new Date(v > 1e12 ? v : v * 1000);
        out.textContent = isNaN(d) ? "✗ 无效的时间戳" : d.toLocaleString("zh-CN", { hour12: false });
      });
      const tick = () => { $("#tsNow").textContent = Math.floor(Date.now() / 1000); };
      tick();
      setInterval(tick, 1000);
    }

    /* ── 颜色转换 ── */
    function initColor() {
      const input = $("#colIn");
      const render = () => {
        const hex = input.value.toUpperCase();
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        const rn = r / 255, gn = g / 255, bn = b / 255;
        const max = Math.max(rn, gn, bn), min = Math.min(rn, gn, bn);
        const l = (max + min) / 2;
        const s = max === min ? 0 : (max - min) / (1 - Math.abs(2 * l - 1));
        let h = 0;
        if (max !== min) {
          if (max === rn) h = ((gn - bn) / (max - min)) % 6;
          else if (max === gn) h = (bn - rn) / (max - min) + 2;
          else h = (rn - gn) / (max - min) + 4;
          h = Math.round(h * 60);
          if (h < 0) h += 360;
        }
        $("#colSw").style.background = hex;
        $("#colOut").textContent = `${hex} · rgb(${r}, ${g}, ${b}) · hsl(${h}, ${Math.round(s * 100)}%, ${Math.round(l * 100)}%)`;
      };
      input.addEventListener("input", render);
      render();
    }

    /* ── 密码生成 ── */
    function initPassword() {
      const chars = "ABCDEFGHJKMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%^&*-_=+";
      const gen = () => {
        let len = Math.round(Number($("#pwLen").value));
        if (!Number.isFinite(len)) len = 16;
        len = Math.min(64, Math.max(6, len));
        const buf = new Uint32Array(len);
        crypto.getRandomValues(buf);
        const pw = [...buf].map((n) => chars[n % chars.length]).join("");
        $("#pwOut").textContent = pw;
        return pw;
      };
      $("#pwGo").addEventListener("click", gen);
      $("#pwCopy").addEventListener("click", () => {
        const pw = $("#pwOut").textContent;
        if (pw && pw !== "—") copyText(pw);
        else showToast("先点「生成」吧");
      });
      gen();
    }

    /* ── Base64 ── */
    function initBase64() {
      const out = $("#b64Out");
      $("#b64Enc").addEventListener("click", () => {
        const v = $("#b64In").value;
        if (!v) { out.textContent = "请先输入内容"; return; }
        out.textContent = btoa(String.fromCharCode(...new TextEncoder().encode(v)));
      });
      $("#b64Dec").addEventListener("click", () => {
        const v = $("#b64In").value.trim();
        if (!v) { out.textContent = "请先输入内容"; return; }
        try {
          out.textContent = new TextDecoder().decode(Uint8Array.from(atob(v), (c) => c.charCodeAt(0)));
        } catch {
          out.textContent = "✗ 不是有效的 Base64";
        }
      });
    }

    /* ── JSON 格式化 ── */
    function initJson() {
      const out = $("#jsonOut");
      $("#jsonGo").addEventListener("click", () => {
        const v = $("#jsonIn").value.trim();
        if (!v) { out.textContent = "请先输入 JSON"; return; }
        try {
          out.textContent = JSON.stringify(JSON.parse(v), null, 2);
        } catch (e) {
          out.textContent = "✗ " + e.message;
        }
      });
    }

    /* ── 考研倒计时（27 初试 · 预计 2026-12-19 08:30 开考） ── */
    function initCountdown() {
      const target = new Date("2026-12-19T08:30:00+08:00").getTime();
      const tick = () => {
        const diff = target - Date.now();
        if (diff <= 0) {
          ["cdD", "cdH", "cdM", "cdS"].forEach((id) => ($("#" + id).textContent = "0"));
          $("#cdMsg").textContent = "初试时间已到 —— 祝旗开得胜，一战成硕！🎓";
          return;
        }
        $("#cdD").textContent = Math.floor(diff / 864e5);
        $("#cdH").textContent = String(Math.floor((diff % 864e5) / 36e5)).padStart(2, "0");
        $("#cdM").textContent = String(Math.floor((diff % 36e5) / 6e4)).padStart(2, "0");
        $("#cdS").textContent = String(Math.floor((diff % 6e4) / 1e3)).padStart(2, "0");
        $("#cdMsg").textContent = "距离 27 考研初试（预计 2026-12-19 上午开考）";
      };
      tick();
      setInterval(tick, 1000);
    }

    /* ── 进制转换 ── */
    function initRadix() {
      const input = $("#rdIn");
      const base = $("#rdBase");
      const out = $("#rdOut");
      const render = () => {
        const v = input.value.trim();
        if (!v) { out.textContent = "—"; return; }
        const n = parseInt(v, Number(base.value));
        if (!Number.isFinite(n) || String(n) !== String(Math.abs(n)) && n < 0) {
          out.textContent = "✗ 无法按所选进制解析（负号单独处理）";
          return;
        }
        if (Number.isNaN(n)) { out.textContent = "✗ 无法按所选进制解析"; return; }
        out.textContent =
          `二进制 ${n.toString(2)}\n八进制 ${n.toString(8)}\n十进制 ${n}\n十六进制 0x${n.toString(16).toUpperCase()}`;
      };
      input.addEventListener("input", render);
      base.addEventListener("change", render);
      render();
    }

    /* ── 正则测试 ── */
    function initRegex() {
      const pat = $("#rxPat");
      const flags = $("#rxFlags");
      const text = $("#rxText");
      const out = $("#rxOut");
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const run = () => {
        const p = pat.value, f = flags.value.replace(/[^gimsuy]/g, ""), t = text.value;
        if (!p || !t) { out.textContent = "输入正则与文本后自动匹配"; out.classList.remove("err"); return; }
        try {
          const re = new RegExp(p, f.includes("g") ? f : f + "g");
          const matches = [...t.matchAll(re)];
          if (!matches.length) {
            out.innerHTML = "未找到匹配";
            out.classList.remove("err");
            return;
          }
          let html = "", last = 0;
          for (const m of matches) {
            html += esc(t.slice(last, m.index)) + "<mark>" + esc(m[0]) + "</mark>";
            last = m.index + m[0].length;
            if (m[0] === "") last++;
          }
          html += esc(t.slice(last));
          out.innerHTML = `共 ${matches.length} 处匹配：\n` + html;
          out.classList.remove("err");
        } catch (e) {
          out.textContent = "✗ " + e.message;
          out.classList.add("err");
        }
      };
      [pat, flags, text].forEach((el) => el.addEventListener("input", run));
    }

    document.addEventListener("DOMContentLoaded", () => {
      initReveal();
      initCharCount();
      initTimestamp();
      initColor();
      initPassword();
      initBase64();
      initJson();
      initCountdown();
      initRadix();
      initRegex();
    });
  </script>
</body>
</html>
