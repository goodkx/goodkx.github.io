<header class="nav">
  <div class="container">
    <a href="index.html" class="logo"><span>~/</span>CCCAD</a>
    <nav class="nav-links" aria-label="主导航">
      <a href="index.html#about">01 关于</a>

<main>
  <section class="page-head container">
    <p class="label">05 / PHOTOS</p>

    <div class="photo-grid reveal" id="grid"></div>
  </section>
</main>

<div class="lightbox" id="lb" role="dialog" aria-modal="true" aria-label="查看原图">
  <button class="lightbox-close" id="lbClose" aria-label="关闭">×</button>
  <img id="lbImg" alt="" />

    </div>
  </div>
</footer>

<script src="data/photos.js?v=220"></script>
<script src="theme.js?v=220"></script>
<script>
(function () {
  var photos = window.PHOTOS || [];
  var grid = document.getElementById("grid");
  var lb = document.getElementById("lb");
  var lbImg = document.getElementById("lbImg");

  grid.innerHTML = photos.map(function (p) {
    return '<figure data-full="' + p.o + '" tabindex="0" role="button" aria-label="查看原图 ' + p.d + '">' +
      '<img src="' + p.t + '" alt="相册照片 ' + p.d + '" loading="lazy" />' +
      "<figcaption>" + p.d + "</figcaption>" +
      "</figure>";
  }).join("");

  function open(fig) {
    lbImg.src = fig.getAttribute("data-full");
    lbImg.alt = fig.querySelector("img").alt;
    lb.classList.add("open");
  }
  function close() {
    lb.classList.remove("open");
    lbImg.removeAttribute("src");
  }

  grid.addEventListener("click", function (e) {
    var fig = e.target.closest("figure");
    if (fig) open(fig);
  });
  grid.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var fig = e.target.closest("figure");
    if (fig) { e.preventDefault(); open(fig); }
  });

  document.getElementById("lbClose").addEventListener("click", close);
  lb.addEventListener("click", function (e) { if (e.target === lb) close(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
})();
</script>
</body>
</html>
