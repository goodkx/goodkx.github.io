<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0e16" />
  <title>鹈鹕骑行中 | SVG 2D 动画</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦤%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0a0e16;
      --card: rgba(17, 25, 40, 0.6);
      --border: rgba(148, 163, 184, 0.14);
      --text: #e6edf3;
      --muted: #8b98a9;
      --accent: #00e5a0;
      --accent-2: #38bdf8;
      --mono: "Cascadia Code", "JetBrains Mono", Consolas, monospace;
      --sans: "Segoe UI", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 26px 20px 60px;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(148,163,184,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148,163,184,.05) 1px, transparent 1px);
      background-size: 44px 44px;
      -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 40%, transparent 100%);
              mask-image: radial-gradient(ellipse 90% 70% at 50% 0%, #000 40%, transparent 100%);
    }
    .top {
      width: min(1000px, 94%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 26px;
      position: relative;
      z-index: 1;
    }
    .back {
      font-family: var(--mono);
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color .25s;
    }
    .back:hover { color: var(--accent); }
    .badge {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--accent);
      border: 1px solid rgba(0,229,160,.35);
      border-radius: 999px;
      padding: 4px 12px;
    }
    .stage {
      width: min(1000px, 94%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      position: relative;
      z-index: 1;
      box-shadow: 0 24px 60px rgba(0,0,0,.45);
    }
    .stage svg { width: 100%; height: auto; display: block; border-radius: 10px; background: #0a0e16; }
    h1 {
      position: relative;
      z-index: 1;
      font-size: clamp(1.3rem, 3vw, 1.8rem);
      margin: 4px 0 20px;
      text-align: center;
    }
    h1 .grad {
      background: linear-gradient(120deg, #00e5a0 10%, #38bdf8 90%);
      -webkit-background-clip: text;
              background-clip: text;
      color: transparent;
    }
    .caption {
      position: relative;
      z-index: 1;
      width: min(1000px, 94%);
      margin-top: 22px;
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 2;
      text-align: center;
    }
    .caption b { color: var(--accent-2); font-weight: 600; }
  </style>
  <link rel="stylesheet" href="theme.css?v=101" />
  <script src="theme.js?v=101"></script>
  <link rel="stylesheet" href="search.css?v=101" />
  <script src="search.js?v=101"></script>
</head>

  <p class="caption">
    纯 SVG 绘制 · 无图片素材 ｜ 车轮/曲柄用 <b>SMIL animateTransform</b> 旋转 ｜
    双腿由<b>两段式骨骼 IK</b> 预先算出 24 帧关键点，与踏板位置逐帧同步 ｜
    地面线滚动速度 = 轮周长 ÷ 转速
  </p>
