  <style>
    .nf {
      width: min(680px, 92%);
      margin: 8vh auto 0;
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .nf-code {
      font-family: var(--mono);
      font-size: clamp(4.5rem, 16vw, 9rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.06em;
      background: var(--gradient);
      -webkit-background-clip: text;
              background-clip: text;
      color: transparent;
      filter: drop-shadow(0 10px 34px rgba(0, 229, 160, 0.25));
      animation: float 5s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .nf h1 { margin: 18px 0 10px; font-size: clamp(1.15rem, 3vw, 1.5rem); }
    .nf p { color: var(--muted); font-size: 0.92rem; margin-bottom: 30px; }
    .nf-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; }
    .nf-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 26px;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .nf-btn.main {
      background: var(--gradient);
      color: #06251a;
      box-shadow: 0 6px 22px rgba(0, 229, 160, 0.25);
    }
    .nf-btn.main:hover { transform: translateY(-3px); }
    .nf-btn.ghost {
      color: var(--accent);
      border: 1px solid var(--border-hover);
      background: transparent;
    }
    .nf-btn.ghost:hover { background: var(--acc-soft-bg); transform: translateY(-3px); }
    .nf-tip {
      margin-top: 40px;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      opacity: 0.8;
    }
    /* 骑车的鹈鹕：横穿屏幕 */
    .nf-rider {
      position: fixed;
      bottom: 22px;
      left: -180px;
      opacity: .9;
      animation: ride 13s linear infinite;
      z-index: 2;
    }
    .nf-rider:hover { animation-play-state: paused; }
    @keyframes ride {
      from { transform: translateX(0); }
      to { transform: translateX(calc(100vw + 220px)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .nf-rider { animation: none; left: auto; right: 22px; }
    }
  </style>
