<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0e16" />
  <meta name="description" content="相册 —— 用照片收藏生活里的瞬间。" />
  <title>相册 | 你的名字</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📷%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="subpage.css?v=141" />
  <link rel="stylesheet" href="theme.css?v=141" />  <link rel="manifest" href="manifest.json?v=133" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <script src="theme.js?v=141"></script>
  <link rel="stylesheet" href="search.css?v=141" />
  <script src="search.js?v=141"></script>
  <script src="achievements.js?v=141"></script>
  <style>
    .photos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    .photo {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: zoom-in;
      transition: transform .3s, border-color .3s, box-shadow .3s;
    }
    .photo:hover {
      transform: translateY(-5px);
      border-color: var(--border-hover);
      box-shadow: 0 14px 36px rgba(0, 0, 0, .35), 0 0 26px rgba(0, 229, 160, .07);
    }
    .photo .art { aspect-ratio: 3 / 2; }
    .photo .art svg { width: 100%; height: 100%; display: block; }
    .photo figcaption {
      padding: 12px 16px;
      font-size: .85rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }
    .photo .d { font-family: var(--mono); font-size: .72rem; color: var(--muted); white-space: nowrap; }


    /* ── 原图查看器（点开就是上传的那张原图） ── */
    .pv {
      position: fixed; inset: 0; z-index: 1200;
      background: rgba(4, 8, 14, .94);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px; opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .pv.open { opacity: 1; pointer-events: auto; }
    .pv-box { margin: 0; max-width: min(1240px, 94vw); display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .pv-box img {
      max-width: 100%; max-height: 72vh; width: auto; height: auto;
      object-fit: contain; border-radius: 10px; background: #0b0f16;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
    }
    .pv-meta {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center;
      font-size: .78rem; color: var(--muted); font-family: var(--mono);
    }
    .pv-meta b { color: var(--text); font-family: inherit; font-size: .95rem; font-weight: 600; }
    .pv-meta a {
      color: var(--accent); text-decoration: none;
      border-bottom: 1px solid rgba(167, 139, 250, .35); padding-bottom: 1px;
    }
    .pv-meta a:hover { border-bottom-color: var(--accent); }
    .pv-x {
      position: fixed; top: 14px; right: 16px; z-index: 3;
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--panel); border: 1px solid var(--border); color: var(--muted);
      font-size: 1rem; cursor: pointer; line-height: 1; transition: color .2s, border-color .2s;
    }
    .pv-x:hover { color: var(--accent); border-color: var(--border-hover); }
    .pv-nav {
      position: fixed; top: 50%; transform: translateY(-50%); z-index: 3;
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--panel); border: 1px solid var(--border); color: var(--text);
      font-size: 1.3rem; line-height: 1; cursor: pointer; opacity: .9;
      transition: transform .2s, border-color .2s, color .2s;
    }
    .pv-nav:hover { transform: translateY(-50%) scale(1.08); border-color: var(--border-hover); color: var(--accent); }
    .pv-nav.prev { left: max(10px, 2vw); }
    .pv-nav.next { right: max(10px, 2vw); }
    .pv-count {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      font-family: var(--mono); font-size: .7rem; color: var(--muted);
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 999px; padding: 5px 14px;
    }
    @media (max-width: 640px) {
      .pv-box img { max-height: 66vh; }
      .pv-nav { width: 38px; height: 38px; font-size: 1.1rem; }
      .pv-count { bottom: 10px; }
    }


    /* ── 用户上传的照片替换画格（照片墙数据 → 主画格） ── */
    .photo .art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo:hover .art img { transform: scale(1.04); }
    .photo .art img { transition: transform .5s ease; }

    @media (max-width: 900px) { .photos { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .photos { grid-template-columns: 1fr; } }
    .gal-count {
      text-align: center;
      font-family: var(--mono);
      font-size: .74rem;
      color: var(--muted);
      margin: -10px 0 22px;
      letter-spacing: .04em;
    }
  </style>
</head>
<body>

  <div class="top">
    <a class="back" href="index.html">← 返回首页</a>
    <a class="badge" href="#wall" title="跳到照片墙">📷 照片墙 ↓</a>
  </div>

  <h1 data-word="GALLERY">光影的 <span class="grad">收件箱</span></h1>
  <p class="gal-count" id="galCount"></p>

  <div class="wrap">
    <!-- ✏️ 换成真实照片：把每个 .art 里的 <svg> 占位图换成
         <img src="你的图片.jpg" alt="描述" style="width:100%;height:100%;object-fit:cover"> 即可 -->
    <div class="photos" id="photosGrid"></div>

    <!-- 📸 照片墙：图片进仓库 gallery/p/，清单存 textdb cccad-photos（上传在站长工作台里做） -->

  </div>

  <p class="caption">
    快门按下的瞬间都是限定款 ｜ 点击看原图 ｜ 想投稿？站长本人也才有一票
  </p>

  <!-- 灯箱 -->
  

  <!-- 原图查看器 -->
  <div class="pv" id="pv" role="dialog" aria-modal="true" aria-label="照片查看器">
    <button class="pv-x" id="pvX" type="button" aria-label="关闭">✕</button>
    <button class="pv-nav prev" id="pvPrev" type="button" aria-label="上一张">‹</button>
    <figure class="pv-box">
      <img id="pvImg" alt="" />
      <figcaption class="pv-meta">
        <b id="pvTitle"></b>
        <span id="pvInfo"></span>
        <a id="pvFull" href="#" target="_blank" rel="noopener">查看原图 ↗</a>
      </figcaption>
    </figure>
    <button class="pv-nav next" id="pvNext" type="button" aria-label="下一张">›</button>
    <span class="pv-count" id="pvCount"></span>
  </div>

  <script>
    const $  = (s, el = document) => el.querySelector(s);
    const $$ = (s, el = document) => [...el.querySelectorAll(s)];

    function initReveal() {
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) { e.target.classList.add("visible"); io.unobserve(e.target); }
        });
      }, { threshold: 0.1 });
      $$(".reveal").forEach((el) => io.observe(el));
    }

    /* ─────────── 📸 照片墙：textdb 清单 → 统一 3:2 卡片 → 点开看原图 ─────────── */
    const PHOTO_DB = "https://textdb.dev/api/data/cccad-photos";
    let shotsData = [];
    let pvCur = 0;

    const escHtml = (s) => String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");

    const fmtSize = (b) => {
      if (!b) return "";
      return b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
    };

    /* 相册统一口径：不显示原始文件名，没写说明就是「站长收藏于 日期」 */
    const hasCustomTitle = (p) => !!(p && p.t && String(p.t).trim());
    const capOf = (p) => hasCustomTitle(p)
      ? String(p.t).trim()
      : ("站长收藏于 " + ((p && p.d) || ""));
    /* 说明里已经带了日期就不再重复（「站长收藏于 2026-10-21」+ 2026-10-21 很啰嗦） */
    const showDate = (p) => !!(p && p.d && !capOf(p).includes(p.d));

    async function loadShots() {
      try {
        const r = await fetch(PHOTO_DB + "?t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) return null;
        const txt = (await r.text()).trim();
        if (!txt) return [];                 /* 空键 = 还没上传过照片 */
        let d;
        try { d = JSON.parse(txt); } catch (e) { return []; }
        const arr = Array.isArray(d) ? d : (Array.isArray(d.photos) ? d.photos : []);
        return arr.filter((p) => p && p.thumb && p.full);
      } catch (e) { return null; }
    }

    function renderWall(list) {
      const box = $("#shots"), empty = $("#wallEmpty");
      if (!list.length) {
        box.innerHTML = "";
        empty.style.display = "";
        $("#wallCount").textContent = "";
        return;
      }
      empty.style.display = "none";
      $("#wallCount").textContent = "· " + list.length + " 张";
      box.innerHTML = list.map((p, i) => `
        <figure class="shot pending" data-i="${i}" tabindex="0" role="button" aria-label="查看原图：${escHtml(capOf(p))}">
          <div class="s-art">
            <img loading="lazy" decoding="async" src="${escHtml(p.thumb)}" alt="${escHtml(capOf(p))}" />
            <span class="s-ph">⏳ 图片加载中…</span>
          </div>
          <figcaption><span class="t">${escHtml(capOf(p))}</span><span class="d">${showDate(p) ? escHtml(p.d) : ""}</span></figcaption>
        </figure>`).join("");

      /* 默认先显示占位，图真加载出来才撤（不会出现「图裂了但什么都没提示」的白框）。
         图没出来 → 阶梯式重试：Pages 构建通常 1–3 分钟，构建完成前 CDN 会把 404 缓存住，
         所以要换 ?r= URL，最多约 10 分钟。 */
      const RETRY = [8, 15, 30, 60, 90, 120, 180];
      box.querySelectorAll(".shot img").forEach((img) => {
        let attempt = 0, timer = null;
        const fig = img.closest(".shot");
        const ph = fig ? fig.querySelector(".s-ph") : null;

        const schedule = () => {
          fig.classList.add("pending");
          if (attempt >= RETRY.length) {
            if (ph) {
              ph.innerHTML = "照片还没就绪<br><a href=\"#\" class=\"s-reload\">点此重新加载</a>";
              const a = ph.querySelector(".s-reload");
              if (a) a.addEventListener("click", (e) => {
                e.preventDefault(); e.stopPropagation();
                location.reload();
              });
            }
            return;
          }
          const wait = RETRY[attempt++];
          if (ph) ph.textContent = "⏳ 照片马上就好…";   /* 不显示秒数，安静重试 */
          clearTimeout(timer);
          timer = setTimeout(() => {
            img.src = img.getAttribute("src").split("?")[0] + "?r=" + Date.now();
          }, wait * 1000);
        };

        img.addEventListener("error", schedule);
        img.addEventListener("load", () => {
          clearTimeout(timer);
          fig.classList.remove("pending");
        });

        /* 关键：监听器挂上之前图可能已经失败（缓存命中时 error 会先触发），补一次判断 */
        if (img.complete && img.naturalWidth === 0) schedule();
      });
    }

    function openPv(i) {
      if (!shotsData.length) return;
      pvCur = (i + shotsData.length) % shotsData.length;
      const p = shotsData[pvCur];
      const img = $("#pvImg");
      img.alt = capOf(p);
      img.src = p.full;
      $("#pvTitle").textContent = capOf(p);
      const dimTxt = p.w && p.h ? p.w + "×" + p.h : "";
      const czTxt = p.cz && p.ow ? "已压缩（原 " + p.ow + "×" + p.oh + "）" : "";
      const dateTxt = showDate(p) ? (p.d || "") : "";   /* 说明里已有日期就不重复 */
      $("#pvInfo").textContent = [dimTxt, fmtSize(p.sz), czTxt, dateTxt].filter(Boolean).join(" · ");
      $("#pvFull").href = p.full;
      $("#pvCount").textContent = (pvCur + 1) + " / " + shotsData.length;
      $("#pv").classList.add("open");
      document.body.style.overflow = "hidden";
      [1, -1].forEach((k) => {           /* 预取左右两张，翻页不白屏 */
        const n = (pvCur + k + shotsData.length) % shotsData.length;
        if (n !== pvCur) { const pre = new Image(); pre.src = shotsData[n].full; }
      });
    }

    function closePv() {
      $("#pv").classList.remove("open");
      document.body.style.overflow = "";
    }

    let uploadCount = 0;
    async function initUploads() {
      let list = [];
      try { list = (await loadShots()) || []; } catch (e) { list = []; }
      shotsData = list;
      const grid = $(".photos");
            const frag = document.createDocumentFragment();
      list.forEach(function (p, k) {
        const fig = document.createElement("figure");
        fig.className = "photo";
        fig.setAttribute("data-upload", "1");
        fig.setAttribute("data-shot", String(k));
        fig.innerHTML = '<div class="art"><img loading="lazy" decoding="async" src="' + escHtml(p.thumb) + '" alt="' + escHtml(capOf(p)) + '"></div>' +
          '<figcaption><span class="t">' + escHtml(capOf(p)) + '</span><span class="d">' + (showDate(p) ? escHtml(p.d) : "") + '</span></figcaption>';
        fig.addEventListener("click", function () { openPv(k); });
        frag.appendChild(fig);
      });
      grid.prepend(frag);
      uploadCount = list.length;
      if (!list.length) {
        grid.innerHTML = '<div style="grid-column: 1/-1; border: 1px dashed var(--border); border-radius: var(--radius); padding: 40px 18px; text-align: center; color: var(--muted); font-size: .86rem; line-height: 1.9">还没有照片。<br>去首页 🛠 站长工作台上传，照片会出现在这里。</div>';
      }
      const gc = $("#galCount");
      if (gc) gc.textContent = "📸 共 " + uploadCount + " 张照片 · 持续更新中";
      /* 原图查看器（#pv）接线 */
      $("#pvX").addEventListener("click", closePv);
      $("#pv").addEventListener("click", (e) => { if (e.target === $("#pv")) closePv(); });
      $("#pvPrev").addEventListener("click", (e) => { e.stopPropagation(); openPv(pvCur - 1); });
      $("#pvNext").addEventListener("click", (e) => { e.stopPropagation(); openPv(pvCur + 1); });
      let tx = null;
      $("#pv").addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; }, { passive: true });
      $("#pv").addEventListener("touchend", (e) => {
        if (tx === null) return;
        const dx = e.changedTouches[0].clientX - tx;
        if (Math.abs(dx) > 45) openPv(pvCur + (dx < 0 ? 1 : -1));
        tx = null;
      }, { passive: true });
      document.addEventListener("keydown", (e) => {
        if (!$("#pv").classList.contains("open")) return;
        if (e.key === "Escape") closePv();
        else if (e.key === "ArrowLeft") openPv(pvCur - 1);
        else if (e.key === "ArrowRight") openPv(pvCur + 1);
      });
    }
    document.addEventListener("DOMContentLoaded", async () => {
      initReveal();
      await initUploads();
    });
  </script>

    
  <script>
    /* ══════════ 🖼 桥接：站长工作台上传的照片，按顺序替换顶部画格 ══════════ */
    (function () {
      function applyUserPhotos(list) {
        const arts = document.querySelectorAll('.photos .photo .art');
        const limit = Math.min(list.length, arts.length);
        for (let k = 0; k < limit; k++) {
          const p = list[k];
          if (!p || !p.full) continue;
          const art = arts[k];
          if (art.dataset.userPhoto === p.full) continue;
          art.dataset.userPhoto = p.full;
          art.innerHTML = '<img loading="lazy" decoding="async" alt="' + escHtml(capOf(p)) + '">';
          /* Pages 构建完成前新图会 404：阶梯重试（与照片墙同一策略） */
          const im = art.querySelector('img');
          let attempt = 0;
          const loadImg = function () { im.src = p.full + (attempt ? '?r=' + attempt : ''); };
          im.onerror = function () {
            attempt++;
            if (attempt <= 6) setTimeout(loadImg, [10, 20, 40, 60, 90, 120][attempt - 1] * 1000);
          };
          loadImg();
          const fig = art.closest('.photo');
          if (fig) {
            const t = fig.querySelector('figcaption .t');
            const d = fig.querySelector('figcaption .d');
            if (t) t.textContent = capOf(p);
            if (d) d.textContent = showDate(p) ? p.d : '';
          }
        }
      }
      function boot() {
        if (Array.isArray(shotsData) && shotsData.length) applyUserPhotos(shotsData);
      }
      document.addEventListener('DOMContentLoaded', boot);
      if (document.readyState !== 'loading') boot();
      window.addEventListener('hashchange', boot);
    })();
  </script>
</body>
