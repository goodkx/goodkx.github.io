  <style>
    .photos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    .photo {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: zoom-in;
      transition: transform .3s, border-color .3s, box-shadow .3s;
    }
    .photo:hover {
      transform: translateY(-5px);
      border-color: var(--border-hover);
      box-shadow: 0 14px 36px rgba(0, 0, 0, .35), 0 0 26px rgba(0, 229, 160, .07);
    }
    .photo .art { aspect-ratio: 3 / 2; }
    .photo .art svg { width: 100%; height: 100%; display: block; }
    .photo figcaption {
      padding: 12px 16px;
      font-size: .85rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }
    .photo .d { font-family: var(--mono); font-size: .72rem; color: var(--muted); white-space: nowrap; }

    /* ── 照片墙（站长上传的真实照片：不管原图多大，预览一律 3:2 同一格式） ── */
    .wall { margin-top: 54px; }
    .wall-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 12px; flex-wrap: wrap; margin-bottom: 16px;
    }
    .wall-head h2 { font-size: 1.12rem; margin: 0; letter-spacing: .01em; }
    .wall-head h2 .wc {
      font-family: var(--mono); font-size: .7rem; color: var(--muted);
      margin-left: 8px; font-weight: 400;
    }
    .shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .shot {
      margin: 0; background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; cursor: zoom-in;
      transition: transform .3s, border-color .3s, box-shadow .3s;
    }
    .shot:hover {
      transform: translateY(-5px); border-color: var(--border-hover);
      box-shadow: 0 14px 36px rgba(0, 0, 0, .35), 0 0 26px rgba(0, 229, 160, .07);
    }
    .shot .s-art { position: relative; aspect-ratio: 3 / 2; background: #0b0f16; overflow: hidden; }
    .shot .s-art img {
      width: 100%; height: 100%; object-fit: cover; object-position: center;
      display: block; transition: transform .5s;
    }
    .shot:hover .s-art img { transform: scale(1.035); }
    .shot .s-ph {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      color: var(--muted); font-family: var(--mono); font-size: .7rem; text-align: center; padding: 12px;
      line-height: 1.9;
    }
    .shot .s-ph .s-reload { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(167, 139, 250, .4); }
    .shot.pending .s-ph { display: flex; }
    .shot figcaption {
      padding: 11px 14px; font-size: .84rem;
      display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
    }
    .shot .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .shot .d { font-family: var(--mono); font-size: .7rem; color: var(--muted); white-space: nowrap; }
    .wall-empty {
      border: 1px dashed var(--border); border-radius: var(--radius);
      padding: 32px 18px; text-align: center; color: var(--muted);
      font-size: .86rem; line-height: 1.9;
    }
    .wall-empty a { color: var(--accent); }
    @media (max-width: 900px) { .shots { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .shots { grid-template-columns: 1fr; } }

    /* ── 原图查看器（点开就是上传的那张原图） ── */
    .pv {
      position: fixed; inset: 0; z-index: 1200;
      background: rgba(4, 8, 14, .94);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px; opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .pv.open { opacity: 1; pointer-events: auto; }
    .pv-box { margin: 0; max-width: min(1240px, 94vw); display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .pv-box img {
      max-width: 100%; max-height: 72vh; width: auto; height: auto;
      object-fit: contain; border-radius: 10px; background: #0b0f16;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
    }
    .pv-meta {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center;
      font-size: .78rem; color: var(--muted); font-family: var(--mono);
    }
    .pv-meta b { color: var(--text); font-family: inherit; font-size: .95rem; font-weight: 600; }
    .pv-meta a {
      color: var(--accent); text-decoration: none;
      border-bottom: 1px solid rgba(167, 139, 250, .35); padding-bottom: 1px;
    }
    .pv-meta a:hover { border-bottom-color: var(--accent); }
    .pv-x {
      position: fixed; top: 14px; right: 16px; z-index: 3;
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--panel); border: 1px solid var(--border); color: var(--muted);
      font-size: 1rem; cursor: pointer; line-height: 1; transition: color .2s, border-color .2s;
    }
    .pv-x:hover { color: var(--accent); border-color: var(--border-hover); }
    .pv-nav {
      position: fixed; top: 50%; transform: translateY(-50%); z-index: 3;
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--panel); border: 1px solid var(--border); color: var(--text);
      font-size: 1.3rem; line-height: 1; cursor: pointer; opacity: .9;
      transition: transform .2s, border-color .2s, color .2s;
    }
    .pv-nav:hover { transform: translateY(-50%) scale(1.08); border-color: var(--border-hover); color: var(--accent); }
    .pv-nav.prev { left: max(10px, 2vw); }
    .pv-nav.next { right: max(10px, 2vw); }
    .pv-count {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      font-family: var(--mono); font-size: .7rem; color: var(--muted);
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 999px; padding: 5px 14px;
    }
    @media (max-width: 640px) {
      .pv-box img { max-height: 66vh; }
      .pv-nav { width: 38px; height: 38px; font-size: 1.1rem; }
      .pv-count { bottom: 10px; }
    }

    /* ── 3D 透视查看器（点击作品进入，coverflow 排布） ── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(4, 8, 14, .9);
      -webkit-backdrop-filter: blur(8px);
              backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }
    .lightbox.open { opacity: 1; pointer-events: auto; }
    .lb-stage {
      position: relative;
      width: min(980px, 94vw);
      height: min(56vh, 430px);
      perspective: 1150px;
      perspective-origin: 50% 50%;
    }
    .cf-track {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }
    .cf-item {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(56%, 560px);
      margin-left: calc(min(56%, 560px) / -2);
      transform-style: preserve-3d;
      transition: transform .5s cubic-bezier(.22,.68,.28,1), opacity .4s ease;
      cursor: pointer;
    }
    .cf-item svg, .cf-item img {
      width: 100%;
      display: block;
      border-radius: 12px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, .55), 0 0 44px rgba(0, 229, 160, .06);
      background: var(--card);
    }
    .cf-item.center { cursor: default; }

    /* ── 站长上传替换（照片 → 替换画作） ── */
    .photo .art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .gal-tools {
      position: absolute;
      top: 8px;
      right: 8px;
      display: none;
      gap: 6px;
      z-index: 5;
    }
    body.gal-admin .gal-tools { display: flex; }
    .gal-tools button {
      border: 1px solid var(--border-hover);
      background: var(--panel);
      color: var(--accent);
      font-family: var(--mono);
      font-size: .68rem;
      border-radius: 999px;
      padding: 4px 10px;
      cursor: pointer;
      transition: transform .15s, background .2s;
    }
    .gal-tools button:hover { transform: scale(1.06); background: var(--acc-soft-bg); }
    .gal-tools button:disabled { opacity: .5; cursor: wait; }
    .gal-tools button.restore { display: none; }
    .gal-tools button.restore.show { display: block; }
    body.gal-admin .photo { cursor: default; }
    #galAdminBtn { cursor: pointer; }
    #galStatus {
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--accent);
      margin-left: 8px;
    }
    .lb-navs {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
      pointer-events: none;
      z-index: 500;
    }
    .lb-navs button {
      pointer-events: auto;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      opacity: .92;
      transition: transform .2s, border-color .2s, color .2s;
    }
    .lb-navs button:hover {
      transform: scale(1.1);
      border-color: var(--border-hover);
      color: var(--accent);
    }
    #lbCount {
      font-family: var(--mono);
      font-size: .72rem;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 12px;
    }
    .lb-cap { text-align: center; margin-top: 20px; color: var(--text); font-size: 1.02rem; font-weight: 600; }
    .lb-hint {
      text-align: center;
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--muted);
      margin-top: 8px;
      opacity: .75;
    }
    @media (max-width: 640px) {
      .lb-stage { height: 44vh; }
      .cf-item { width: 76%; }
    }

    @media (max-width: 900px) { .photos { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .photos { grid-template-columns: 1fr; } }
  </style>
</head>

  <script>
    const $  = (s, el = document) => el.querySelector(s);
    const $$ = (s, el = document) => [...el.querySelectorAll(s)];

    function initReveal() {
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) { e.target.classList.add("visible"); io.unobserve(e.target); }
        });
      }, { threshold: 0.1 });
      $$(".reveal").forEach((el) => io.observe(el));
    }

    function initLightbox() {
      const lightbox = $("#lightbox");
      const photos = $$(".photo");
      const track = $("#cfTrack");
      const n = photos.length;
      let cur = 0;

      /* 20 幅作品全部上轨道，按透视排布 */
      const items = photos.map((p) => {
        const el = document.createElement("div");
        el.className = "cf-item";
        el.innerHTML = p.querySelector("svg").outerHTML;
        track.appendChild(el);
        return el;
      });

      const layout = () => {
        items.forEach((el, i) => {
          const off = ((i - cur + n + n / 2) % n) - n / 2; /* 最短环绕路径 */
          const ax = Math.abs(off), sign = off < 0 ? -1 : 1;
          const x = sign * (Math.min(ax, 1) * 46 + Math.max(0, ax - 1) * 26);
          const ry = -sign * (Math.min(ax, 1) * 40 + Math.max(0, ax - 1) * 7);
          const z = 90 - Math.min(ax, 3) * 160;
          el.style.transform = "translateY(-50%) translateX(" + x.toFixed(1) + "%) translateZ(" + z.toFixed(0) + "px) rotateY(" + ry.toFixed(1) + "deg)";
          el.style.opacity = ax > 3.4 ? "0" : Math.max(0.1, 1 - ax * 0.28).toFixed(2);
          el.style.visibility = ax > 3.6 ? "hidden" : "visible";
          el.style.zIndex = String(300 - Math.round(ax * 10));
          /* 只有正中 + 相邻两张可点：渐隐的远景图禁用指针，防止「点到后面的图」 */
          el.style.pointerEvents = ax < 1.5 ? "auto" : "none";
          el.classList.toggle("center", ax < 0.5);
        });
      };
      /* 暴露给上传模块：照片替换后同步 3D 查看器 */
      lightbox.__cfSync = layout;

      const show = (i) => {
        cur = (i + n) % n;
        /* 重灌可见项内容：站长替换的照片实时进查看器 */
        items.forEach((el, k) => {
          if (Math.abs(((k - cur + n + n / 2) % n) - n / 2) < 3.6) {
            el.innerHTML = photos[k].querySelector(".art").innerHTML;
          }
        });
        layout();
        const p = photos[cur];
        $("#lbCap").textContent =
          p.querySelector(".t").textContent + " · " + p.querySelector(".d").textContent;
        $("#lbCount").textContent = (cur + 1) + " / " + n;
        lightbox.classList.add("open");
      };

      photos.forEach((p, i) => {
        p.addEventListener("click", () => show(i));
      });
      items.forEach((el, i) => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          if (i !== cur) show(i); /* 点两侧作品 = 跳到那一张 */
        });
      });
      $("#lbPrev").addEventListener("click", (e) => { e.stopPropagation(); show(cur - 1); });
      $("#lbNext").addEventListener("click", (e) => { e.stopPropagation(); show(cur + 1); });
      lightbox.addEventListener("click", () => lightbox.classList.remove("open"));
      /* 手机左右滑动 */
      let tx = null;
      lightbox.addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; }, { passive: true });
      lightbox.addEventListener("touchend", (e) => {
        if (tx === null) return;
        const dx = e.changedTouches[0].clientX - tx;
        if (Math.abs(dx) > 45) show(cur + (dx < 0 ? 1 : -1));
        tx = null;
      }, { passive: true });
      document.addEventListener("keydown", (e) => {
        if (!lightbox.classList.contains("open")) return;
        if (e.key === "Escape") lightbox.classList.remove("open");
        else if (e.key === "ArrowLeft") show(cur - 1);
        else if (e.key === "ArrowRight") show(cur + 1);
      });
      show(0);
      lightbox.classList.remove("open"); /* 预排布，首次打开即是成品布局 */
    }

    /* ─────────── 📸 照片墙：textdb 清单 → 统一 3:2 卡片 → 点开看原图 ─────────── */
    const PHOTO_DB = "https://textdb.dev/api/data/cccad-photos";
    let shotsData = [];
    let pvCur = 0;

    const escHtml = (s) => String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");

    const fmtSize = (b) => {
      if (!b) return "";
      return b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
    };

    /* 相册统一口径：不显示原始文件名，没写说明就是「站长收藏于 日期」 */
    const hasCustomTitle = (p) => !!(p && p.t && String(p.t).trim());
    const capOf = (p) => hasCustomTitle(p)
      ? String(p.t).trim()
      : ("站长收藏于 " + ((p && p.d) || ""));
    /* 说明里已经带了日期就不再重复（「站长收藏于 2026-10-21」+ 2026-10-21 很啰嗦） */
    const showDate = (p) => !!(p && p.d && !capOf(p).includes(p.d));

    async function loadShots() {
      try {
        const r = await fetch(PHOTO_DB + "?t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) return null;
        const txt = (await r.text()).trim();
        if (!txt) return [];                 /* 空键 = 还没上传过照片 */
        let d;
        try { d = JSON.parse(txt); } catch (e) { return []; }
        const arr = Array.isArray(d) ? d : (Array.isArray(d.photos) ? d.photos : []);
        return arr.filter((p) => p && p.thumb && p.full);
      } catch (e) { return null; }
    }

    function renderWall(list) {
      const box = $("#shots"), empty = $("#wallEmpty");
      if (!list.length) {
        box.innerHTML = "";
        empty.style.display = "";
        $("#wallCount").textContent = "";
        return;
      }
      empty.style.display = "none";
      $("#wallCount").textContent = "· " + list.length + " 张";
      box.innerHTML = list.map((p, i) => `
        <figure class="shot pending" data-i="${i}" tabindex="0" role="button" aria-label="查看原图：${escHtml(capOf(p))}">
          <div class="s-art">
            <img loading="lazy" decoding="async" src="${escHtml(p.thumb)}" alt="${escHtml(capOf(p))}" />
            <span class="s-ph">⏳ 图片加载中…</span>
          </div>
          <figcaption><span class="t">${escHtml(capOf(p))}</span><span class="d">${showDate(p) ? escHtml(p.d) : ""}</span></figcaption>
        </figure>`).join("");

      /* 默认先显示占位，图真加载出来才撤（不会出现「图裂了但什么都没提示」的白框）。
         图没出来 → 阶梯式重试：Pages 构建通常 1–3 分钟，构建完成前 CDN 会把 404 缓存住，
         所以要换 ?r= URL，最多约 10 分钟。 */
      const RETRY = [8, 15, 30, 60, 90, 120, 180];
      box.querySelectorAll(".shot img").forEach((img) => {
        let attempt = 0, timer = null;
        const fig = img.closest(".shot");
        const ph = fig ? fig.querySelector(".s-ph") : null;

        const schedule = () => {
          fig.classList.add("pending");
          if (attempt >= RETRY.length) {
            if (ph) {
              ph.innerHTML = "照片还没就绪<br><a href=\"#\" class=\"s-reload\">点此重新加载</a>";
              const a = ph.querySelector(".s-reload");
              if (a) a.addEventListener("click", (e) => {
                e.preventDefault(); e.stopPropagation();
                location.reload();
              });
            }
            return;
          }
          const wait = RETRY[attempt++];
          if (ph) ph.textContent = "⏳ 照片马上就好…";   /* 不显示秒数，安静重试 */
          clearTimeout(timer);
          timer = setTimeout(() => {
            img.src = img.getAttribute("src").split("?")[0] + "?r=" + Date.now();
          }, wait * 1000);
        };

        img.addEventListener("error", schedule);
        img.addEventListener("load", () => {
          clearTimeout(timer);
          fig.classList.remove("pending");
        });

        /* 关键：监听器挂上之前图可能已经失败（缓存命中时 error 会先触发），补一次判断 */
        if (img.complete && img.naturalWidth === 0) schedule();
      });
    }

    function openPv(i) {
      if (!shotsData.length) return;
      pvCur = (i + shotsData.length) % shotsData.length;
      const p = shotsData[pvCur];
      const img = $("#pvImg");
      img.alt = capOf(p);
      img.src = p.full;
      $("#pvTitle").textContent = capOf(p);
      const dimTxt = p.w && p.h ? p.w + "×" + p.h : "";
      const czTxt = p.cz && p.ow ? "已压缩（原 " + p.ow + "×" + p.oh + "）" : "";
      const dateTxt = showDate(p) ? (p.d || "") : "";   /* 说明里已有日期就不重复 */
      $("#pvInfo").textContent = [dimTxt, fmtSize(p.sz), czTxt, dateTxt].filter(Boolean).join(" · ");
      $("#pvFull").href = p.full;
      $("#pvCount").textContent = (pvCur + 1) + " / " + shotsData.length;
      $("#pv").classList.add("open");
      document.body.style.overflow = "hidden";
      [1, -1].forEach((k) => {           /* 预取左右两张，翻页不白屏 */
        const n = (pvCur + k + shotsData.length) % shotsData.length;
        if (n !== pvCur) { const pre = new Image(); pre.src = shotsData[n].full; }
      });
    }

    function closePv() {
      $("#pv").classList.remove("open");
      document.body.style.overflow = "";
    }

    async function initWall() {
      const list = await loadShots();
      shotsData = list || [];
      renderWall(shotsData);
      if (list === null) {
        $("#wallEmpty").innerHTML = "照片墙暂时加载不到（网络原因），刷新一次试试。";
        $("#wallEmpty").style.display = "";
      }
      $("#shots").addEventListener("click", (e) => {
        const fig = e.target.closest(".shot");
        if (fig) openPv(+fig.getAttribute("data-i"));
      });
      $("#shots").addEventListener("keydown", (e) => {
        const fig = e.target.closest(".shot");
        if (fig && (e.key === "Enter" || e.key === " ")) {
          e.preventDefault();
          openPv(+fig.getAttribute("data-i"));
        }
      });
      $("#pvX").addEventListener("click", closePv);
      $("#pv").addEventListener("click", (e) => { if (e.target === $("#pv")) closePv(); });
      $("#pvPrev").addEventListener("click", (e) => { e.stopPropagation(); openPv(pvCur - 1); });
      $("#pvNext").addEventListener("click", (e) => { e.stopPropagation(); openPv(pvCur + 1); });
      /* 手机左右滑动 */
      let tx = null;
      $("#pv").addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; }, { passive: true });
      $("#pv").addEventListener("touchend", (e) => {
        if (tx === null) return;
        const dx = e.changedTouches[0].clientX - tx;
        if (Math.abs(dx) > 45) openPv(pvCur + (dx < 0 ? 1 : -1));
        tx = null;
      }, { passive: true });
      document.addEventListener("keydown", (e) => {
        if (!$("#pv").classList.contains("open")) return;
        if (e.key === "Escape") closePv();
        else if (e.key === "ArrowLeft") openPv(pvCur - 1);
        else if (e.key === "ArrowRight") openPv(pvCur + 1);
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      initReveal();
      initLightbox();
      initWall();
      initGalleryAdmin();
    });
  </script>

  <script>
    /* ══════════ 📤 站长上传系统：照片压缩 → textdb 云端 → 替换画作（可恢复） ══════════ */
    (function () {
      const IDX_URL = "https://textdb.dev/api/data/cccad-gallery-index";
      const PKEY = (n) => "https://textdb.dev/api/data/cccad-gallery-p" + n;
      const PASS = "cccad2026";
      const gPhotos = Array.from(document.querySelectorAll(".photo"));
      const originalArt = gPhotos.map((p) => p.querySelector(".art").innerHTML);
      const replaced = new Array(gPhotos.length).fill(false);
      let pendingSlot = -1;

      const asciiJson = (obj) =>
        JSON.stringify(obj).replace(/[\u0080-\uFFFF]/g, (ch) => "\\u" + ch.charCodeAt(0).toString(16).padStart(4, "0"));
      const status = (t) => { const el = document.getElementById("galStatus"); if (el) el.textContent = t; };

      /* 云端照片应用到卡面 */
      function applyPhoto(n, dataUrl) {
        const art = gPhotos[n] && gPhotos[n].querySelector(".art");
        if (!art) return;
        art.innerHTML = '<img src="' + dataUrl + '" alt="站长上传的照片" loading="lazy">';
        replaced[n] = true;
        syncTools(n);
        if (document.getElementById("lightbox").classList.contains("open")) syncViewer();
      }
      function restoreArt(n) {
        const art = gPhotos[n] && gPhotos[n].querySelector(".art");
        if (!art) return;
        art.innerHTML = originalArt[n];
        replaced[n] = false;
        syncTools(n);
        if (document.getElementById("lightbox").classList.contains("open")) syncViewer();
      }
      /* 3D 查看器同步（查看器暴露 __cfSync 就调用） */
      function syncViewer() {
        const lb = document.getElementById("lightbox");
        if (lb && typeof lb.__cfSync === "function") lb.__cfSync();
      }
      function syncTools(n) {
        const box = gPhotos[n] && gPhotos[n].querySelector(".gal-tools");
        if (!box) return;
        box.querySelector(".restore").classList.toggle("show", replaced[n]);
      }

      /* 索引：哪些槽位被替换了 */
      async function getIndex() {
        const r = await fetch(IDX_URL + "?n=" + Date.now(), { cache: "no-store" });
        const t = await r.text();
        if (!t.trim()) return { slots: [] };
        const d = JSON.parse(t);
        return { slots: Array.isArray(d.slots) ? d.slots : [] };
      }
      async function saveIndex(slots) {
        const r = await fetch(IDX_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: asciiJson({ slots: slots }),
        });
        if (!r.ok) throw new Error("HTTP " + r.status);
      }

      /* 压缩：最长边 1100px · JPEG 0.78 · 保留 EXIF 方向 */
      async function compress(file) {
        let img;
        try {
          img = await createImageBitmap(file, { imageOrientation: "from-image" });
        } catch (e) {
          img = await new Promise(function (res, rej) {
            const i = new Image();
            i.onload = function () { res(i); };
            i.onerror = rej;
            i.src = URL.createObjectURL(file);
          });
        }
        const w = img.width || img.naturalWidth;
        const h = img.height || img.naturalHeight;
        const scale = Math.min(1, 1100 / Math.max(w, h));
        const cv = document.createElement("canvas");
        cv.width = Math.max(1, Math.round(w * scale));
        cv.height = Math.max(1, Math.round(h * scale));
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        return cv.toDataURL("image/jpeg", 0.78);
      }

      async function saveSlot(n, dataUrl) {
        const rp = await fetch(PKEY(n), {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: asciiJson({ s: dataUrl, m: new Date().toLocaleDateString("zh-CN") }),
        });
        if (!rp.ok) throw new Error("HTTP " + rp.status);
        const idx = await getIndex();
        const slots = idx.slots;
        if (!slots.includes(n)) {
          slots.push(n);
          await saveIndex(slots);
        }
      }
      async function clearSlot(n) {
        const rp = await fetch(PKEY(n), {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: asciiJson({ gone: 1 }),
        });
        if (!rp.ok) throw new Error("HTTP " + rp.status);
        const idx = await getIndex();
        await saveIndex(idx.slots.filter(function (s) { return s !== n; }));
      }

      /* 云端照片加载（进页面就渲染真实照片） */
      async function loadCloud() {
        try {
          const idx = await getIndex();
          await Promise.all(
            idx.slots.map(async function (n) {
              try {
                const r = await fetch(PKEY(n) + "?n=" + Date.now(), { cache: "no-store" });
                const t = await r.text();
                if (!t.trim()) return;
                const d = JSON.parse(t);
                if (d.s) applyPhoto(n, d.s);
              } catch (e) {}
            })
          );
        } catch (e) {}
      }

      /* 站长模式 */
      function enterAdmin() {
        document.body.classList.add("gal-admin");
        gPhotos.forEach(function (p, n) {
          if (p.querySelector(".gal-tools")) return;
          const tools = document.createElement("div");
          tools.className = "gal-tools";
          tools.innerHTML = '<button type="button" class="up">📤 替换</button><button type="button" class="restore">↺ 原画</button>';
          p.querySelector(".art").appendChild(tools);
          syncTools(n);
          tools.querySelector(".up").addEventListener("click", function (e) {
            e.stopPropagation();
            pendingSlot = n;
            document.getElementById("galFile").click();
          });
          tools.querySelector(".restore").addEventListener("click", async function (e) {
            e.stopPropagation();
            const btn = e.currentTarget;
            btn.disabled = true;
            status("恢复中…");
            try {
              await clearSlot(n);
              restoreArt(n);
              status("已恢复原画 ✓");
            } catch (err) {
              status("恢复失败");
            }
            btn.disabled = false;
          });
        });
      }

      document.getElementById("galAdminBtn").addEventListener("click", function () {
        var isAdmin = false;
        try { isAdmin = sessionStorage.getItem("gallery-admin") === "1"; } catch (e) {}
        if (isAdmin) {
          document.body.classList.remove("gal-admin");
          try { sessionStorage.removeItem("gallery-admin"); } catch (e) {}
          this.textContent = "🛡️ 站长";
          status("");
          return;
        }
        var pass = prompt("站长口令（与留言板相同）");
        if (pass === null) return;
        if (pass !== PASS) { status("口令不对 🙅"); return; }
        try { sessionStorage.setItem("gallery-admin", "1"); } catch (e) {}
        document.body.classList.add("gal-admin");
        enterAdmin();
        this.textContent = "✓ 管理中";
        status("管理中：点卡片右上角 📤 替换照片");
      });

      document.getElementById("galFile").addEventListener("change", async function (e) {
        const file = e.target.files && e.target.files[0];
        e.target.value = "";
        if (!file || pendingSlot < 0) return;
        const n = pendingSlot;
        pendingSlot = -1;
        status("压缩上传中…");
        try {
          const dataUrl = await compress(file);
          await saveSlot(n, dataUrl);
          applyPhoto(n, dataUrl);
          status("已替换 ✓ 刷新后所有人可见");
        } catch (err) {
          status("上传失败：" + String(err).slice(0, 40));
        }
      });

      loadCloud();

      /* 站长会话保持：刷新后自动回到管理状态 */
      try {
        if (sessionStorage.getItem("gallery-admin") === "1") {
          document.body.classList.add("gal-admin");
          enterAdmin();
          var gb = document.getElementById("galAdminBtn");
          if (gb) gb.textContent = "✓ 管理中";
        }
      } catch (e) {}
    })();
  </script>
</body>
