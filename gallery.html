  <style>
    .photos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    .photo {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: zoom-in;
      transition: transform .3s, border-color .3s, box-shadow .3s;
    }
    .photo:hover {
      transform: translateY(-5px);
      border-color: var(--border-hover);
      box-shadow: 0 14px 36px rgba(0, 0, 0, .35), 0 0 26px rgba(0, 229, 160, .07);
    }
    .photo .art { aspect-ratio: 3 / 2; }
    .photo .art svg { width: 100%; height: 100%; display: block; }
    .photo figcaption {
      padding: 12px 16px;
      font-size: .85rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }
    .photo .d { font-family: var(--mono); font-size: .72rem; color: var(--muted); white-space: nowrap; }

    /* 灯箱（点击放大） */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(4, 8, 14, .86);
      -webkit-backdrop-filter: blur(6px);
              backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
    }
    .lightbox.open { opacity: 1; pointer-events: auto; }
    .lb-inner {
      position: relative;
      width: min(720px, 92%);
      background: var(--card);
      border: 1px solid var(--border-hover);
      border-radius: 16px;
      padding: 16px;
      transform: scale(.94);
      transition: transform .3s;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
    }
    .lightbox.open .lb-inner { transform: scale(1); }
    .lb-inner svg { width: 100%; display: block; border-radius: 10px; }
    .lb-navs {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      pointer-events: none;
    }
    .lb-navs button {
      pointer-events: auto;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 1.15rem;
      line-height: 1;
      cursor: pointer;
      opacity: 0.9;
      transition: transform 0.2s, border-color 0.2s, color 0.2s;
    }
    .lb-navs button:hover {
      transform: scale(1.1);
      border-color: var(--border-hover);
      color: var(--accent);
    }
    #lbCount {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 12px;
    }

    .lb-cap { text-align: center; margin-top: 14px; color: var(--text); font-size: .95rem; }
    .lb-hint {
      text-align: center;
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--accent);
      margin-top: 8px;
      opacity: .75;
    }

    @media (max-width: 900px) { .photos { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .photos { grid-template-columns: 1fr; } }
  </style>
</head>

  <!-- 灯箱 -->
  <div class="lightbox" id="lightbox" role="dialog" aria-label="图片放大预览">
    <div class="lb-inner">
      <div style="position: relative;">
        <div id="lbArt"></div>
        <div class="lb-navs">
          <button id="lbPrev" type="button" aria-label="上一张">‹</button>
          <span id="lbCount">1 / 6</span>
          <button id="lbNext" type="button" aria-label="下一张">›</button>
        </div>
      </div>
      <p class="lb-cap" id="lbCap"></p>
      <p class="lb-hint">点击任意处关闭</p>
    </div>
  </div>

  <script>
    const $  = (s, el = document) => el.querySelector(s);
    const $$ = (s, el = document) => [...el.querySelectorAll(s)];

    function initReveal() {
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) { e.target.classList.add("visible"); io.unobserve(e.target); }
        });
      }, { threshold: 0.1 });
      $$(".reveal").forEach((el) => io.observe(el));
    }

    function initLightbox() {
      const lightbox = $("#lightbox");
      const photos = $$(".photo");
      let cur = 0;

      const show = (i) => {
        cur = (i + photos.length) % photos.length;
        const p = photos[cur];
        $("#lbArt").innerHTML = p.querySelector("svg").outerHTML;
        $("#lbCap").textContent =
          p.querySelector(".t").textContent + " · " + p.querySelector(".d").textContent;
        $("#lbCount").textContent = (cur + 1) + " / " + photos.length;
        lightbox.classList.add("open");
      };

      photos.forEach((p, i) => {
        p.addEventListener("click", () => show(i));
      });
      $("#lbPrev").addEventListener("click", (e) => { e.stopPropagation(); show(cur - 1); });
      $("#lbNext").addEventListener("click", (e) => { e.stopPropagation(); show(cur + 1); });
      lightbox.addEventListener("click", () => lightbox.classList.remove("open"));
      document.addEventListener("keydown", (e) => {
        if (!lightbox.classList.contains("open")) return;
        if (e.key === "Escape") lightbox.classList.remove("open");
        else if (e.key === "ArrowLeft") show(cur - 1);
        else if (e.key === "ArrowRight") show(cur + 1);
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      initReveal();
      initLightbox();
    });
  </script>
