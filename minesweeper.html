<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0e16" />
  <meta name="description" content="经典扫雷 —— 首次点击必安全，右键或长按插旗，用最快时间排清所有地雷，成绩上云全站排名。" />
  <title>扫雷 | CCCAD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💣%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="subpage.css?v=120" />
  <link rel="stylesheet" href="theme.css?v=121" />
  <link rel="stylesheet" href="search.css?v=116" />
  <link rel="manifest" href="manifest.json?v=116" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <script src="theme.js?v=121"></script>
  <script src="search.js?v=116"></script>
  <script src="leaderboard.js?v=117"></script>
  <style>
    .tbtn {
      background: var(--card); border: 1px solid var(--border-hover); border-radius: 999px;
      color: var(--accent); font-family: inherit; font-size: .84rem;
      padding: 9px 22px; cursor: pointer; transition: transform .2s, box-shadow .2s;
    }
    .tbtn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0, 229, 160, 0.3); }
    .tbtn:disabled { opacity: 0.6; cursor: wait; transform: none; }

    .mode-row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .mode-row button {
      background: var(--card); border: 1px solid var(--border); border-radius: 999px;
      color: var(--muted); font-family: inherit; font-size: .8rem;
      padding: 7px 18px; cursor: pointer; transition: all .2s;
    }
    .mode-row button.on { color: #06251a; background: var(--gradient); border-color: transparent; font-weight: 700; }

    .hud {
      display: flex; justify-content: center; align-items: stretch; gap: 14px; flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .hud div {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 18px; text-align: center; font-family: var(--mono);
    }
    .hud b { display: block; font-size: 1.2rem; color: var(--accent); font-variant-numeric: tabular-nums; }
    .hud span { font-size: .68rem; color: var(--muted); }
    .hud .face-btn {
      font-size: 1.5rem; cursor: pointer; line-height: 1;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 6px 16px; transition: transform .15s;
    }
    .hud .face-btn:hover { transform: scale(1.12); }

    /* 🚩 插旗模式（手机端点击插旗） */
    .flag-mode button {
      border-radius: 999px; font-size: .78rem; padding: 6px 16px;
    }
    .flag-mode button.on { color: #06251a; background: var(--gradient); border-color: transparent; font-weight: 700; }

    .board {
      --cols: 9;
      display: grid;
      grid-template-columns: repeat(var(--cols), 1fr);
      gap: 3px;
      width: min(100%, calc(var(--cols) * 40px));
      margin: 0 auto 20px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .cell {
      aspect-ratio: 1 / 1;
      border: none; padding: 0; font-family: var(--mono); font-weight: 700;
      font-size: clamp(.7rem, 2.4vw, 1.05rem);
      border-radius: 6px;
      background: linear-gradient(160deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .01) 50%), var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, transform .1s;
    }
    .cell:hover { transform: scale(1.06); }
    .cell.open {
      background: var(--bg-soft);
      border-color: transparent;
      cursor: default;
      box-shadow: inset 0 1px 4px rgba(0, 0, 0, .35);
    }
    .cell.open:hover { transform: none; }
    .cell.boom { background: rgba(244, 63, 94, .35); border-color: rgba(244, 63, 94, .6); }
    .cell.mine-show { background: rgba(244, 63, 94, .12); }
    .n1 { color: #60a5fa; } .n2 { color: #34d399; } .n3 { color: #f87171; } .n4 { color: #c084fc; }
    .n5 { color: #fbbf24; } .n6 { color: #22d3ee; } .n7 { color: #f472b6; } .n8 { color: #94a3b8; }

    .win-panel {
      display: none;
      background: linear-gradient(120deg, rgba(0, 229, 160, .14), rgba(56, 189, 248, .10));
      border: 1px solid var(--border-hover);
      border-radius: var(--radius);
      padding: 26px;
      text-align: center;
      max-width: 480px;
      margin: 0 auto 16px;
    }
    .win-panel.show { display: block; }
    .win-panel h2 { margin-bottom: 8px; }
    .win-panel p { color: var(--muted); font-size: .88rem; margin-bottom: 14px; }
    .record { color: var(--accent); font-family: var(--mono); font-size: .8rem; }

    /* 🏆 全站排名 */
    .lb-panel { max-width: 480px; margin: 0 auto 16px; text-align: left; }
    .lb-head { font-family: var(--mono); font-size: .74rem; color: var(--muted); margin-bottom: 8px; }
    .lb-row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-bottom: 1px dashed var(--border); font-family: var(--mono); font-size: .74rem; }
    .lb-row.first { background: var(--acc-soft-bg); border-radius: 6px; }
    .lb-row .rk { width: 20px; color: var(--accent); }
    .lb-row .nm { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lb-row .sc { color: var(--accent); }
    .lb-row .dt { color: var(--muted); font-size: .62rem; }
    .lb-submit { display: none; align-items: center; gap: 8px; margin: 12px 0 4px; flex-wrap: wrap; }
    .lb-submit.show { display: flex; }
    .lb-submit input {
      flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: inherit; font-size: .8rem; padding: 8px 10px; outline: none;
    }
    .lb-submit input:focus { border-color: var(--border-hover); }
    .lb-ok { color: var(--accent); font-family: var(--mono); font-size: .78rem; }
  </style>
</head>
<body>

  <div class="top">
    <a class="back" href="index.html">← 返回首页</a>
    <a class="back" href="arcade.html">🕹 街机厅</a>
    <span class="badge">💣 mines</span>
  </div>

  <h1 data-word="MINES">经典 <span class="grad">扫雷</span></h1>

  <div class="wrap">
    <div class="mode-row">
      <button type="button" data-m="easy" class="on">🙂 简单 9×9 · 10 雷</button>
      <button type="button" data-m="hard">🔥 困难 16×16 · 40 雷</button>
    </div>

    <div class="hud">
      <div><b id="mLeft">10</b><span>🚩 剩余雷数</span></div>
      <div><b id="mTime">0s</b><span>⏱ 用时</span></div>
      <button class="face-btn" id="mFace" type="button" aria-label="重新开始">😊</button>
    </div>

    <div class="mode-row flag-mode">
      <button type="button" id="mFlagMode">🚩 插旗模式：关（手机长按也可插旗）</button>
    </div>

    <div class="board" id="board"></div>

    <div class="win-panel" id="endPanel">
      <h2 id="endTitle"></h2>
      <p id="endText"></p>
      <span class="record" id="endRecord"></span>
      <div class="lb-submit" id="mLb">
        <input type="text" id="mLbName" maxlength="10" placeholder="昵称（10 字内）" />
        <button class="tbtn" id="mLbGo" type="button">🏆 上榜</button>
      </div>
      <div class="row" style="justify-content:center; margin-top:16px">
        <button class="tbtn" id="mRestart">🔄 再来一局</button>
      </div>
    </div>

    <div class="lb-panel" id="minesLb"></div>

    <p class="caption">左键 / 点按翻开 · 右键 / 长按插旗 · <b>首次点击必安全</b> · 排清全部地雷即胜利，成绩上云全站排名</p>
  </div>

  <script>
    const $ = (s, el = document) => el.querySelector(s);
    const MODES = {
      easy: { rows: 9, cols: 9, mines: 10 },
      hard: { rows: 16, cols: 16, mines: 40 },
    };
    let mode = "easy", grid = [], started = false, over = false;
    let opened = 0, flags = 0, t0 = 0, timer = null, secs = 0;
    let flagMode = false;
    const BKEY = () => "mines-best-" + mode;

    const board = $("#board");

    function fmtTime(s) { return s < 60 ? s + "s" : Math.floor(s / 60) + "分" + (s % 60) + "s"; }

    function build() {
      const m = MODES[mode];
      over = false; started = false; opened = 0; flags = 0; secs = 0;
      clearInterval(timer); timer = null;
      $("#mTime").textContent = "0s";
      $("#mLeft").textContent = m.mines;
      $("#mFace").textContent = "😊";
      $("#endPanel").classList.remove("show");
      $("#mLb").classList.remove("show");
      grid = Array.from({ length: m.rows * m.cols }, () => ({ mine: false, open: false, flag: false, n: 0 }));
      board.style.setProperty("--cols", m.cols);
      board.innerHTML = "";
      const frag = document.createDocumentFragment();
      grid.forEach((c, i) => {
        const b = document.createElement("button");
        b.className = "cell";
        b.type = "button";
        b.dataset.i = i;
        b.setAttribute("aria-label", "格子 " + i);
        frag.appendChild(b);
      });
      board.appendChild(frag);
      const best = getBest();
      $("#endRecord").textContent = "";
    }

    function getBest() {
      try { return JSON.parse(localStorage.getItem(BKEY())); } catch (e) { return null; }
    }

    function neighbors(i) {
      const m = MODES[mode], r = Math.floor(i / m.cols), c = i % m.cols, out = [];
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < m.rows && nc >= 0 && nc < m.cols) out.push(nr * m.cols + nc);
      }
      return out;
    }

    /* 首次点击后布雷：点击格及其周围一圈必安全 */
    function place(safeIdx) {
      const m = MODES[mode], total = m.rows * m.cols;
      const banned = new Set([safeIdx, ...neighbors(safeIdx)]);
      let placed = 0;
      while (placed < m.mines) {
        const i = Math.floor(Math.random() * total);
        if (grid[i].mine || banned.has(i)) continue;
        grid[i].mine = true;
        placed++;
      }
      grid.forEach((c, i) => { c.n = neighbors(i).filter((j) => grid[j].mine).length; });
      timer = setInterval(() => {
        secs = Math.floor((Date.now() - t0) / 1000);
        $("#mTime").textContent = fmtTime(secs);
      }, 500);
    }

    function render(i) {
      const c = grid[i];
      const el = board.children[i];
      el.textContent = "";
      el.className = "cell";
      if (c.open) {
        el.classList.add("open");
        if (c.n > 0) { el.textContent = c.n; el.classList.add("n" + c.n); }
      } else if (c.flag) {
        el.textContent = "🚩";
      }
    }

    function reveal(i) {
      if (over) return;
      const c = grid[i];
      if (c.open || c.flag) return;
      if (!started) { started = true; t0 = Date.now(); place(i); }
      if (c.mine) return boom(i);
      const stack = [i];
      while (stack.length) {
        const j = stack.pop();
        const cj = grid[j];
        if (cj.open || cj.flag) continue;
        cj.open = true; opened++;
        render(j);
        if (cj.n === 0) neighbors(j).forEach((k) => { if (!grid[k].open && !grid[k].mine) stack.push(k); });
      }
      checkWin();
    }

    function toggleFlag(i) {
      if (over) return;
      const c = grid[i];
      if (c.open) return;
      c.flag = !c.flag;
      flags += c.flag ? 1 : -1;
      $("#mLeft").textContent = MODES[mode].mines - flags;
      render(i);
    }

    function boom(hitIdx) {
      over = true;
      clearInterval(timer);
      grid.forEach((c, i) => {
        if (c.mine) {
          const el = board.children[i];
          el.textContent = "💣";
          el.classList.add(i === hitIdx ? "boom" : "mine-show");
        }
      });
      $("#mFace").textContent = "😵";
      $("#endTitle").textContent = "💥 踩雷了！";
      $("#endText").textContent = "坚持了 " + fmtTime(secs) + " —— 雷区最不缺的就是第二次机会。";
      $("#endRecord").textContent = "";
      $("#endPanel").classList.add("show");
    }

    function checkWin() {
      const m = MODES[mode];
      if (opened !== m.rows * m.cols - m.mines) return;
      over = true;
      clearInterval(timer);
      grid.forEach((c, i) => { if (c.mine && !c.flag) { c.flag = true; render(i); } });
      $("#mLeft").textContent = 0;
      $("#mFace").textContent = "😎";
      const best = getBest();
      const isRecord = !best || secs < best;
      if (isRecord) {
        try { localStorage.setItem(BKEY(), JSON.stringify(secs)); } catch (e) {}
      }
      $("#endTitle").textContent = "🎉 排雷成功！";
      $("#endText").textContent = fmtTime(secs) + " 清完 " + m.mines + " 颗雷 —— " +
        (secs <= 30 ? "扫雷之神 🥇" : secs <= 90 ? "手感火热 🔥" : "稳扎稳打 👍");
      $("#endRecord").textContent = isRecord ? "🌟 新纪录！" : "本机最佳：" + fmtTime(best);
      $("#mLb").classList.add("show");
      $("#mLbName").value = LB.getName();
      $("#endPanel").classList.add("show");
    }

    /* 交互：点按 = 插旗模式下插旗否则翻开；右键 / 长按 = 插旗 */
    let pressTimer = null, longFired = false;
    board.addEventListener("click", (e) => {
      const el = e.target.closest(".cell");
      if (!el) return;
      const i = +el.dataset.i;
      if (flagMode) toggleFlag(i); else reveal(i);
    });
    board.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      const el = e.target.closest(".cell");
      if (el) toggleFlag(+el.dataset.i);
    });
    board.addEventListener("touchstart", (e) => {
      const el = e.target.closest(".cell");
      if (!el) return;
      longFired = false;
      pressTimer = setTimeout(() => { longFired = true; toggleFlag(+el.dataset.i); }, 380);
    }, { passive: true });
    ["touchend", "touchmove", "touchcancel"].forEach((ev) =>
      board.addEventListener(ev, () => { clearTimeout(pressTimer); }, { passive: true }));
    board.addEventListener("click", () => { setTimeout(() => { if (longFired) { longFired = false; } }, 0); }, true);

    /* 长按插旗后阻止紧随的 click 翻开 */
    board.addEventListener("click", (e) => {
      if (longFired) { e.stopPropagation(); longFired = false; }
    }, true);

    $("#mFlagMode").addEventListener("click", () => {
      flagMode = !flagMode;
      $("#mFlagMode").textContent = flagMode ? "🚩 插旗模式：开（点按 = 插旗）" : "🚩 插旗模式：关（手机长按也可插旗）";
      $("#mFlagMode").classList.toggle("on", flagMode);
    });
    $("#mFace").addEventListener("click", build);
    $("#mRestart").addEventListener("click", build);
    document.querySelectorAll(".mode-row [data-m]").forEach((b) =>
      b.addEventListener("click", () => {
        mode = b.dataset.m;
        document.querySelectorAll(".mode-row [data-m]").forEach((x) => x.classList.toggle("on", x === b));
        build();
      }));

    /* 🏆 全站排名（用时升序） */
    LB.render("mines", "#minesLb", "秒");
    $("#mLbGo").addEventListener("click", async () => {
      const btn = $("#mLbGo");
      btn.disabled = true;
      try {
        const name = $("#mLbName").value;
        LB.saveName(name);
        const res = await LB.submit("mines", name, secs);
        $("#mLb").innerHTML = '<span class="lb-ok">🏆 已上榜 · 第 ' + res.rank + ' 名 ✓</span>';
        LB.render("mines", "#minesLb", "秒");
      } catch (e) {
        btn.disabled = false;
        $("#mLb").innerHTML = '<span class="lb-ok" style="color:var(--muted)">上榜失败，稍后再试</span>';
      }
    });

    build();
  </script>
</body>
</html>
