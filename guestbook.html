<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0e16" />
  <meta name="description" content="留言板 —— 打个招呼，留下你想说的话。" />
  <title>留言板 | CCCAD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💌%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="subpage.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="search.css" />
  <script src="theme.js"></script>
  <script src="search.js"></script>
  <style>
    .gform {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 30px;
      transition: border-color .3s;
    }
    .gform:hover { border-color: var(--border-hover); }
    .gform .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    #gbName {
      flex: 0 0 180px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.88rem;
      padding: 10px 12px;
    }
    #gbName:focus { outline: none; border-color: var(--border-hover); }
    #gbText {
      width: 100%;
      margin: 12px 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      line-height: 1.8;
      padding: 12px 14px;
      resize: vertical;
    }
    #gbText:focus { outline: none; border-color: var(--border-hover); }
    .tbtn {
      background: var(--gradient);
      color: #06251a;
      border: none;
      border-radius: 8px;
      font-size: 0.86rem;
      font-weight: 600;
      font-family: inherit;
      padding: 10px 20px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .tbtn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0, 229, 160, 0.3); }
    .tbtn:disabled { opacity: 0.6; cursor: wait; transform: none; }
    .hint { font-size: 0.74rem; color: var(--muted); font-family: var(--mono); }
    #gbStatus { font-family: var(--mono); font-size: 0.72rem; padding: 3px 10px; border-radius: 999px; }
    #gbStatus.cloud { color: var(--accent); background: var(--acc-soft-bg); border: 1px solid var(--acc-soft-bd); }
    #gbStatus.offline { color: #fbbf24; background: rgba(251, 191, 36, 0.08); border: 1px solid rgba(251, 191, 36, 0.25); }

    .glist { display: flex; flex-direction: column; gap: 14px; }
    .gmsg {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      transition: border-color .3s;
    }
    .gmsg:hover { border-color: var(--border-hover); }
    .gmsg .gh {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .gmsg .who { display: flex; align-items: center; gap: 8px; }
    .gmsg .avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .gmsg .who b { color: var(--accent); font-size: 0.9rem; }
    .gmsg .time { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); }
    .gmsg .gm { color: var(--text); font-size: 0.9rem; line-height: 1.9; word-break: break-word; }
    .chip.owner {
      color: var(--accent);
      background: var(--acc-soft-bg);
      border-color: var(--acc-soft-bd);
    }
  </style>
</head>
<body>

  <div class="top">
    <a class="back" href="index.html">← 返回首页</a>
    <span class="badge">💌 guestbook</span>
  </div>

  <h1>留下你的 <span class="grad">痕迹</span></h1>

  <div class="wrap">

    <div class="gform reveal">
      <div class="row">
        <input id="gbName" maxlength="30" placeholder="怎么称呼你？（可留空）" />
        <span id="gbStatus" class="offline">📡 连接中…</span>
      </div>
      <textarea id="gbText" rows="3" maxlength="500" placeholder="留下你想说的话……"></textarea>
      <div class="row">
        <button class="tbtn" id="gbPost" type="button">✉️ 发布留言</button>
        <span class="hint" id="gbCount">0 / 500</span>
      </div>
    </div>

    <div class="glist" id="gbList"></div>

  </div>

  <p class="caption">
    留言已接入 <b>Supabase 云数据库</b>，<b>所有访客可见</b> ｜
    你当前的网络若连不上云端，会自动进入离线模式（留言暂存本机）
  </p>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const $  = (s, el = document) => el.querySelector(s);
    const $$ = (s, el = document) => [...el.querySelectorAll(s)];
    let toastTimer = null;
    function showToast(msg) {
      const toast = $("#toast");
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
    }
    function initReveal() {
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) { e.target.classList.add("visible"); io.unobserve(e.target); }
        });
      }, { threshold: 0.1 });
      $$(".reveal").forEach((el) => io.observe(el));
    }

    /* ══════════ Supabase 云端配置 ══════════
       SB_KEY 是 anon 公开密钥（安全靠后台的 RLS 策略保证），放前端是官方推荐做法 */
    const SB_URL = "https://flykgkocxgpcudupgbp.supabase.co";
    const SB_KEY = "sb_publishable_ZhPxj7o-5zD-juN-xI9tFA_113t27GA";
    const SB_HEADERS = {
      apikey: SB_KEY,
      Authorization: "Bearer " + SB_KEY,
      "Content-Type": "application/json",
    };

    let messages = [];   // 当前展示的留言
    let cloudOk = false; // 云端是否可达
    const LKEY = "guestbook-local-fallback";

    function loadLocal() {
      try { return JSON.parse(localStorage.getItem(LKEY) || "null") || []; }
      catch (e) { return []; }
    }
    function saveLocal(list) {
      try { localStorage.setItem(LKEY, JSON.stringify(list)); } catch (e) {}
    }

    function esc(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function fmt(t) {
      return new Date(t).toLocaleString("zh-CN", { hour12: false });
    }
    function avatarFor(n) {
      let h = 0;
      for (const ch of n) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      return ["🌟", "🍀", "🌙", "☕", "🎈", "🐟", "🌸", "⚡"][h % 8];
    }

    function render() {
      $("#gbList").innerHTML = messages.length
        ? messages.map((m) => `
          <div class="gmsg">
            <div class="gh">
              <span class="who">
                <span class="avatar">${avatarFor(m.n)}</span>
                <b>${esc(m.n)}</b>
                ${m.n === "CCCAD" ? '<span class="chip green owner">站长</span>' : ""}
              </span>
              <span class="time">${fmt(m.t)}</span>
            </div>
            <div class="gm">${esc(m.m)}</div>
          </div>`).join("")
        : `<div class="gmsg"><div class="gm">还没有留言，来抢第一个沙发吧！</div></div>`;
    }

    function updateStatus() {
      const s = $("#gbStatus");
      s.className = cloudOk ? "cloud" : "offline";
      s.textContent = cloudOk ? "☁️ 云端已连接 · 所有访客可见" : "📴 离线模式 · 留言暂存本机";
    }

    /* 从云端拉取留言；失败则回退到本机缓存 */
    async function refresh() {
      try {
        const res = await fetch(
          SB_URL + "/rest/v1/messages?select=*&order=created_at.desc&limit=100",
          { headers: SB_HEADERS }
        );
        if (!res.ok) throw new Error("HTTP " + res.status);
        const rows = await res.json();
        messages = rows.map((r) => ({
          n: r.name || "匿名朋友",
          m: r.content,
          t: new Date(r.created_at).getTime(),
        }));
        cloudOk = true;
        saveLocal(messages);
      } catch {
        cloudOk = false;
        messages = loadLocal();
        if (!messages.length) {
          messages = [
            { n: "CCCAD", m: "欢迎来到留言板！想说什么都行，我看到一定回 👋", t: Date.now() - 86400000 },
            { n: "鹈鹕", m: "我骑车路过的，顺便打个招呼 🚲", t: Date.now() - 3600000 },
          ];
        }
      }
      updateStatus();
      render();
    }

    /* 发布留言：优先写云端，失败暂存本机 */
    async function postMessage(n, m) {
      $("#gbPost").disabled = true;
      try {
        const res = await fetch(SB_URL + "/rest/v1/messages", {
          method: "POST",
          headers: { ...SB_HEADERS, Prefer: "return=representation" },
          body: JSON.stringify({ name: n, content: m }),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const row = (await res.json())[0];
        messages.unshift({ n: row.name, m: row.content, t: new Date(row.created_at).getTime() });
        cloudOk = true;
        saveLocal(messages);
        render();
        return true;
      } catch {
        messages.unshift({ n, m, t: Date.now() });
        saveLocal(messages);
        render();
        return false;
      } finally {
        $("#gbPost").disabled = false;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      initReveal();
      refresh();

      const text = $("#gbText");
      text.addEventListener("input", () => {
        $("#gbCount").textContent = [...text.value].length + " / 500";
      });

      $("#gbPost").addEventListener("click", async () => {
        const n = $("#gbName").value.trim() || "匿名朋友";
        const m = text.value.trim();
        if (!m) { showToast("先写点什么再发布吧 ✍️"); return; }
        const ok = await postMessage(n, m);
        if (ok) {
          text.value = "";
          $("#gbCount").textContent = "0 / 500";
          showToast("留言已上云，所有人可见 ✓");
        } else {
          showToast("连不上云端，留言暂存本机（网络恢复后新留言自动上云）");
        }
        updateStatus();
      });
    });
  </script>
</body>
</html>
