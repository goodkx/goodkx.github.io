<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0e16" />
  <meta name="description" content="留言板 —— 打个招呼，留下你想说的话。" />
  <title>留言板 | CCCAD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💬%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://textdb.dev" />
  <link rel="stylesheet" href="subpage.css?v=120" />
  <link rel="stylesheet" href="theme.css?v=121" />
  <link rel="stylesheet" href="search.css?v=116" />  <link rel="manifest" href="manifest.json?v=116" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <script src="theme.js?v=121"></script>
  <script src="search.js?v=116"></script>
  <style>
    .gform {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 30px;
      transition: border-color .3s;
    }
    .gform:hover { border-color: var(--border-hover); }

    /* 隔断线 */
    .backup-h {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 4px 0 18px;
      font-family: var(--mono);
      font-size: 0.74rem;
      letter-spacing: 1px;
      color: var(--muted);
    }
    .backup-h::before, .backup-h::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .gform .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    #gbName {
      flex: 0 0 180px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.88rem;
      padding: 10px 12px;
    }
    #gbName:focus { outline: none; border-color: var(--border-hover); }
    #gbText {
      width: 100%;
      margin: 12px 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      line-height: 1.8;
      padding: 12px 14px;
      resize: vertical;
    }
    #gbText:focus { outline: none; border-color: var(--border-hover); }
    .tbtn {
      background: var(--gradient);
      color: #06251a;
      border: none;
      border-radius: 8px;
      font-size: 0.86rem;
      font-weight: 600;
      font-family: inherit;
      padding: 10px 20px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .tbtn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0, 229, 160, 0.3); }
    .tbtn:disabled { opacity: 0.6; cursor: wait; transform: none; }
    .hint { font-size: 0.74rem; color: var(--muted); font-family: var(--mono); }
    #gbStatus { font-family: var(--mono); font-size: 0.72rem; padding: 3px 10px; border-radius: 999px; }
    #gbStatus.cloud { color: var(--accent); background: var(--acc-soft-bg); border: 1px solid var(--acc-soft-bd); }
    #gbStatus.offline { color: #fbbf24; background: rgba(251, 191, 36, 0.08); border: 1px solid rgba(251, 191, 36, 0.25); }
    .tretry {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 0.68rem;
      padding: 4px 12px;
      cursor: pointer;
      transition: color .2s, border-color .2s;
    }
    .tretry:hover { color: var(--accent); border-color: var(--border-hover); }

    .glist { display: flex; flex-direction: column; gap: 14px; }
    .gmsg {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      transition: border-color .3s;
    }
    .gmsg:hover { border-color: var(--border-hover); }
    .gmsg .gh {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .gmsg .who { display: flex; align-items: center; gap: 8px; }
    .gmsg .avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .gmsg .who b { color: var(--accent); font-size: 0.9rem; }
    .gmsg .time { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); }
    .gmsg .gm { color: var(--text); font-size: 0.9rem; line-height: 1.9; word-break: break-word; }
    .chip.owner {
      color: var(--accent);
      background: var(--acc-soft-bg);
      border-color: var(--acc-soft-bd);
    }

    /* 表情回应 */
    .gr { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .rx {
      background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
      color: var(--muted); font-family: var(--mono); font-size: .72rem;
      padding: 3px 11px; cursor: pointer;
      transition: color .2s, border-color .2s, background .2s;
    }
    .rx:hover { color: var(--accent); border-color: var(--border-hover); }
    .rx.mine { color: var(--accent); border-color: var(--acc-soft-bd); background: var(--acc-soft-bg); }
    .rx.del:hover { color: #ff8484; border-color: rgba(255, 132, 132, .45); background: rgba(255, 132, 132, .08); }
  </style>
</head>
<body>

  <div class="top">
    <a class="back" href="index.html">← 返回首页</a>
    <span class="badge">💬 guestbook</span>
  </div>

  <h1 data-word="CHAT">留下你的 <span class="grad">痕迹</span></h1>

  <div class="wrap">

    <div class="backup-h">直连留言板 · 无需登录 · 留言全员可见</div>

    <div class="gform reveal">
      <div class="row">
        <input id="gbName" maxlength="30" placeholder="怎么称呼你？（可留空）" />
        <span id="gbStatus" class="offline">📡 连接中…</span>
        <button class="tretry" id="gbRetry" type="button" title="重新尝试连接云端">🔄 重新连接</button>
        <button class="tretry" id="gbAdmin" type="button" title="站长管理（删除留言）">🛡️ 站长</button>
        <button class="tretry" id="gbExport" type="button" title="导出留言备份 JSON（站长）" style="display:none">⬇ 导出</button>
      </div>
      <textarea id="gbText" rows="3" maxlength="500" placeholder="留下你想说的话……"></textarea>
      <div class="row">
        <button class="tbtn" id="gbPost" type="button">✉️ 发布留言</button>
        <span class="hint" id="gbCount">0 / 500</span>
      </div>
    </div>

    <div class="glist" id="gbList"></div>

  </div>

  <p class="caption">
    留言自动切换数据源：EdgeOne 云接口 → textdb 免注册云库 → Supabase 云库 → 本机暂存 ｜ <b>所有访客可见</b>
  </p>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const $  = (s, el = document) => el.querySelector(s);
    const $$ = (s, el = document) => [...el.querySelectorAll(s)];
    let toastTimer = null;
    function showToast(msg) {
      const toast = $("#toast");
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
    }
    function initReveal() {
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) { e.target.classList.add("visible"); io.unobserve(e.target); }
        });
      }, { threshold: 0.1 });
      $$(".reveal").forEach((el) => io.observe(el));
    }

    /* ══════════ 数据源：四级自动切换 ══════════
       1) EdgeOne 同源接口 /api/messages（整站部署在 EdgeOne 时可用，国内直连）
       2) textdb.dev 免注册云存储（国内直连，所有访客可见）
       3) Supabase 云数据库（海外网络可达时的备用）
       4) 本机 localStorage（全部失败时的兜底） */
    const TDB_URL = "https://textdb.dev/api/data/cccad-gb-95592aa7";
    const SB_URL = "https://flykgkocxgpcudupgbp.supabase.co";
    const SB_KEY = "sb_publishable_ZhPxj7o-5zD-juN-xI9tFA_113t27GA";
    const SB_HEADERS = {
      apikey: SB_KEY,
      Authorization: "Bearer " + SB_KEY,
      "Content-Type": "application/json",
    };

    let messages = [];   // 当前展示的留言
    let sourceName = ""; // 当前数据源："edgeone" / "textdb" / "supabase" / "local"
    let lastErr = "";    // 最近一次云端写入失败的原因
    const LKEY = "guestbook-local-fallback";

    /* 带超时的 fetch：读 8 秒 / 写 15 秒，避免整条回退链被卡住 */
    const fetchT = (url, opts = {}, ms = 8000) => {
      try { return fetch(url, { ...opts, signal: AbortSignal.timeout(ms) }); }
      catch (e) { return fetch(url, opts); }
    };
    const errText = (e) => (e && e.name === "TimeoutError") ? "写入超时" : String((e && e.message) || e);

    function loadLocal() {
      try { return JSON.parse(localStorage.getItem(LKEY) || "null") || []; }
      catch (e) { return []; }
    }
    function saveLocal(list) {
      try { localStorage.setItem(LKEY, JSON.stringify(list)); } catch (e) {}
    }

    function esc(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function linkify(s) {
      return s.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    }
    function fmt(t) {
      return new Date(t).toLocaleString("zh-CN", { hour12: false });
    }
    function fmtAgo(t) {
      const s = Date.now() - t;
      if (s < 60000) return "刚刚";
      if (s < 3600000) return Math.floor(s / 60000) + " 分钟前";
      if (s < 86400000) return Math.floor(s / 3600000) + " 小时前";
      if (s < 604800000) return Math.floor(s / 86400000) + " 天前";
      return fmt(t);
    }

    /* 记住本机发过的留言，渲染时带"我"标记 */
    const MINE_KEY = "gb-mine";
    function markMine(t) {
      try {
        const a = JSON.parse(localStorage.getItem(MINE_KEY) || "[]");
        a.push(t);
        localStorage.setItem(MINE_KEY, JSON.stringify(a.slice(-100)));
      } catch (e) {}
    }
    function isMine(t) {
      try { return JSON.parse(localStorage.getItem(MINE_KEY) || "[]").indexOf(t) !== -1; }
      catch (e) { return false; }
    }

    /* 表情回应（每条留言每种表情每台设备只算一次） */
    const RK = "gb-reacted";
    function hasReacted(t, e) {
      try { return JSON.parse(localStorage.getItem(RK) || "[]").indexOf(t + "|" + e) !== -1; }
      catch (err) { return false; }
    }
    function markReacted(t, e) {
      try {
        const a = JSON.parse(localStorage.getItem(RK) || "[]");
        a.push(t + "|" + e);
        localStorage.setItem(RK, JSON.stringify(a.slice(-200)));
      } catch (err) {}
    }

    /* ── 站长模式（删除留言） ── */
    const ADMIN_PASS = "cccad2026"; /* ← 想换口令就改这里 */
    let isAdmin = false;
    try { isAdmin = sessionStorage.getItem("gb-admin") === "1"; } catch (e) {}

    /* 把完整留言列表写回 textdb（暖连接 + 重试），成功返回 true */
    async function cloudWriteList(list) {
      const payload = asciiJson({ messages: list });
      for (let i = 0; i < 3; i++) {
        try {
          const r = await fetchT(TDB_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: payload,
          }, 15000);
          if (r.ok) { sourceName = "textdb"; return true; }
          lastErr = "HTTP " + r.status;
        } catch (err) { lastErr = errText(err); }
        await new Promise((r2) => setTimeout(r2, 1500 * (i + 1)));
      }
      return false;
    }
    function avatarFor(n) {
      let h = 0;
      for (const ch of n) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      return ["🌟", "🍀", "🌙", "☕", "🎈", "🐟", "🌸", "⚡"][h % 8];
    }

    function render() {
      $("#gbList").innerHTML = messages.length
        ? messages.map((m, idx) => `
          <div class="gmsg">
            <div class="gh">
              <span class="who">
                <span class="avatar">${avatarFor(m.n)}</span>
                <b>${esc(m.n)}</b>
                ${m.n === "CCCAD" ? '<span class="chip green owner">站长</span>' : ""}
                ${isMine(m.t) ? '<span class="chip green">我</span>' : ""}
              </span>
              <span class="time">${fmtAgo(m.t)}</span>
              ${isAdmin && sourceName === "textdb" ? `<button class="rx del" data-t="${m.t}" title="删除这条留言">🗑</button>` : ""}
            </div>
            <div class="gm">${linkify(esc(m.m))}</div>
            ${sourceName === "textdb" ? `
            <div class="gr">
              ${["👍", "❤️", "🔥"].map((e) => {
                const c = (m.r && m.r[e]) || 0;
                return `<button class="rx${hasReacted(m.t, e) ? " mine" : ""}" data-i="${idx}" data-e="${e}">${e}${c ? " " + c : ""}</button>`;
              }).join("")}
            </div>` : ""}
          </div>`).join("")
        : `<div class="gmsg"><div class="gm">还没有留言，来抢第一个沙发吧！</div></div>`;
    }

    function updateStatus() {
      const s = $("#gbStatus");
      if (sourceName === "edgeone") {
        s.className = "cloud";
        s.textContent = "☁️ 云端已连接（EdgeOne）· 所有访客可见";
      } else if (sourceName === "textdb") {
        s.className = "cloud";
        s.textContent = "☁️ 云端已连接（textdb）· 所有访客可见";
      } else if (sourceName === "supabase") {
        s.className = "cloud";
        s.textContent = "☁️ 云端已连接（Supabase）· 所有访客可见";
      } else {
        s.className = "offline";
        s.textContent = "📴 暂离线 · 已存本机，点「重新连接」重试";
      }
    }

    async function tryEdgeOne() {
      const res = await fetchT("/api/messages");
      if (!res.ok) throw new Error("HTTP " + res.status);
      const rows = await res.json();
      if (!Array.isArray(rows)) throw new Error("bad payload");
      messages = rows;
      return "edgeone";
    }
    /* textdb 服务端只接受 ASCII 安全的 JSON，中文需转义为 \uXXXX */
    function asciiJson(obj) {
      return JSON.stringify(obj).replace(/[\u0080-\uFFFF]/g, (ch) =>
        "\\u" + ch.charCodeAt(0).toString(16).padStart(4, "0")
      );
    }

    async function tryTextDb() {
      const res = await fetchT(TDB_URL);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = JSON.parse(await res.text());
      const rows = Array.isArray(data.messages)
        ? data.messages
        : Array.isArray(data._json)
          ? data._json
          : [];
      messages = rows.slice(-200).reverse(); /* 存储正序，展示最新在前 */
      return "textdb";
    }

    async function trySupabase() {
      const res = await fetchT(
        SB_URL + "/rest/v1/messages?select=*&order=created_at.desc&limit=100",
        { headers: SB_HEADERS }
      );
      if (!res.ok) throw new Error("HTTP " + res.status);
      const rows = await res.json();
      messages = rows.map((r) => ({
        n: r.name || "匿名朋友",
        m: r.content,
        t: new Date(r.created_at).getTime(),
      }));
      return "supabase";
    }

    async function refresh() {
      for (const attempt of [tryEdgeOne, tryTextDb, trySupabase]) {
        try {
          sourceName = await attempt();
          saveLocal(messages);
          updateStatus();
          render();
          return;
        } catch (e) { /* 试下一个数据源 */ }
      }
      sourceName = "local";
      messages = loadLocal();
      if (!messages.length) {
        messages = [
          { n: "CCCAD", m: "欢迎来到留言板！想说什么都行，我看到一定回 👋", t: Date.now() - 86400000 },
          { n: "鹈鹕", m: "我骑车路过的，顺便打个招呼 🚲", t: Date.now() - 3600000 },
        ];
      }
      updateStatus();
      render();
    }

    async function postMessage(n, m) {
      $("#gbPost").disabled = true;
      try {
        /* 1) EdgeOne 同源接口 */
        try {
          const res = await fetchT("/api/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: n, content: m }),
          }, 15000);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const row = await res.json();
          messages.unshift({ n: row.n, m: row.m, t: row.t || Date.now() });
          markMine(row.t || Date.now());
          sourceName = "edgeone";
          saveLocal(messages);
          return true;
        } catch (e) { lastErr = errText(e); }

        /* 2) textdb.dev：读 → 追加 → 整体写回（免注册云存储，国内直连） */
        try {
          /* 先做一次带重试的读取：既拿最新列表，也"焐热"新连接
             （textdb 会掐掉闲置几秒的连接，冷连接上的 POST 会直接失败） */
          let cur = [];
          for (let i = 0; i < 2; i++) {
            try {
              const r0 = await fetchT(TDB_URL);
              if (r0.ok) {
                const d0 = JSON.parse(await r0.text());
                if (Array.isArray(d0.messages)) cur = d0.messages;
                else if (Array.isArray(d0._json)) cur = d0._json;
                break;
              }
            } catch (e) {}
            await new Promise((r) => setTimeout(r, 1000));
          }
          /* 读取失败时用页面已有数据兜底，避免把云端历史覆盖掉 */
          if (!cur.length && sourceName !== "local" && messages.length) {
            cur = messages.slice().reverse();
          }
          const myT = Date.now();
          const next = [...cur, { n: n, m: m, t: myT }].slice(-200);

          /* 写入自动重试（textdb 免费服务偶发抽风） */
          if (!(await cloudWriteList(next))) throw new Error(lastErr || "写入失败");
          messages = next.slice().reverse();
          sourceName = "textdb";
          markMine(myT);
          saveLocal(messages);
          return true;
        } catch (e) { lastErr = errText(e); }

        /* 3) Supabase */
        try {
          const res = await fetchT(SB_URL + "/rest/v1/messages", {
            method: "POST",
            headers: { ...SB_HEADERS, Prefer: "return=representation" },
            body: JSON.stringify({ name: n, content: m }),
          }, 15000);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const row = (await res.json())[0];
          messages.unshift({ n: row.name, m: row.content, t: new Date(row.created_at).getTime() });
          markMine(new Date(row.created_at).getTime());
          sourceName = "supabase";
          saveLocal(messages);
          return true;
        } catch (e) { lastErr = errText(e); }

        /* 4) 本机 */
        const t0 = Date.now();
        messages.unshift({ n, m, t: t0 });
        markMine(t0);
        sourceName = "local";
        saveLocal(messages);
        return false;
      } finally {
        $("#gbPost").disabled = false;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      initReveal();
      refresh();
      setInterval(render, 60000); /* 相对时间每分钟自动刷新 */
      /* 带站长会话刷新时，导出按钮直接可见 */
      document.getElementById("gbExport").style.display = isAdmin ? "" : "none";

      $("#gbRetry").addEventListener("click", () => {
        const s = $("#gbStatus");
        s.textContent = "📡 连接中…";
        s.className = "offline";
        refresh();
      });

      $("#gbAdmin").addEventListener("click", () => {
        if (isAdmin) {
          try { sessionStorage.removeItem("gb-admin"); } catch (e) {}
          isAdmin = false;
          render();
          document.getElementById("gbExport").style.display = "none";
          showToast("站长模式已关闭");
          return;
        }
        /* 内联口令行（不用原生 prompt，体验更好） */
        const old = document.getElementById("gbAdminRow");
        if (old) { old.remove(); return; }
        const row = document.createElement("div");
        row.id = "gbAdminRow";
        row.className = "row";
        row.style.marginTop = "8px";
        row.innerHTML = '<input type="password" id="gbPass" placeholder="站长口令" style="flex:none; width:150px" />' +
          '<button class="tbtn" id="gbUnlock" type="button">解锁</button>' +
          '<span class="hint">口令在 guestbook.html 的 ADMIN_PASS 修改</span>';
        $("#gbAdmin").after(row);
        $("#gbPass").focus();
        const tryUnlock = () => {
          const v = ($("#gbPass").value || "").trim();
          if (v === ADMIN_PASS) {
            isAdmin = true;
            try { sessionStorage.setItem("gb-admin", "1"); } catch (e) {}
            row.remove();
            render();
            document.getElementById("gbExport").style.display = "";
            showToast("站长模式已开启：每条留言出现 🗑 按钮 ✓");
          } else showToast("口令不对 🙅");
        };
        $("#gbUnlock").addEventListener("click", tryUnlock);
        $("#gbPass").addEventListener("keydown", (ev) => { if (ev.key === "Enter") tryUnlock(); });
      });

      /* ⬇ 导出留言备份（站长） */
      $("#gbExport").addEventListener("click", () => {
        const data = JSON.stringify(messages, null, 2);
        const blob = new Blob([data], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "guestbook-backup-" + new Date().toISOString().slice(0, 10) + ".json";
        a.click();
        URL.revokeObjectURL(a.href);
        showToast("备份已下载 ✓");
      });

      /* 表情回应：点一下，计数上云 */
      $("#gbList").addEventListener("click", async (e) => {
        /* ── 站长删除（二次确认：先点变"确认删除?"，再点执行） ── */
        const del = e.target.closest(".del");
        if (del) {
          if (del.dataset.armed !== "1") {
            del.dataset.armed = "1";
            del.textContent = "确认删除?";
            del.style.color = "#ff8484";
            setTimeout(() => {
              if (del.isConnected) { del.dataset.armed = ""; del.textContent = "🗑"; del.style.color = ""; }
            }, 3000);
            return;
          }
          const t = Number(del.dataset.t);
          const idx = messages.findIndex((x) => x.t === t);
          if (idx === -1) return;
          const removed = messages.splice(idx, 1)[0];
          render();
          const list = messages.slice().reverse().map((x) => { const c = { ...x }; delete c.pending; return c; });
          const ok = await cloudWriteList(list);
          if (ok) { saveLocal(messages); showToast("已删除 ✓"); }
          else { messages.splice(idx, 0, removed); render(); saveLocal(messages); showToast("删除失败（" + lastErr + "），已还原"); }
          return;
        }
        /* ── 表情回应 ── */
        const btn = e.target.closest(".rx");
        if (!btn) return;
        const m = messages[Number(btn.dataset.i)];
        if (!m) return;
        const emo = btn.dataset.e;
        if (hasReacted(m.t, emo)) { showToast("这个回应已经点过啦 ✓"); return; }
        m.r = m.r || {};
        m.r[emo] = (m.r[emo] || 0) + 1;
        markReacted(m.t, emo);
        render();
        const list = messages.slice().reverse().map((x) => { const c = { ...x }; delete c.pending; return c; });
        const ok = await cloudWriteList(list);
        if (ok) { saveLocal(messages); showToast("回应已上云 ✓"); }
        else showToast("回应暂存本机（" + lastErr + "）");
      });

      const text = $("#gbText");

      /* 草稿自动保存：输入一半刷新/关页也不丢 */
      const DKEY = "gb-draft";
      try {
        const draft = JSON.parse(localStorage.getItem(DKEY) || "{}");
        if (draft.name) $("#gbName").value = draft.name;
        if (draft.text) {
          text.value = draft.text;
          $("#gbCount").textContent = [...text.value].length + " / 500";
        }
      } catch (e) {}
      const saveDraft = () => {
        try { localStorage.setItem(DKEY, JSON.stringify({ name: $("#gbName").value, text: text.value })); } catch (e) {}
      };
      $("#gbName").addEventListener("input", saveDraft);

      text.addEventListener("input", () => {
        $("#gbCount").textContent = [...text.value].length + " / 500";
        saveDraft();
      });

      $("#gbPost").addEventListener("click", async () => {
        const n = $("#gbName").value.trim() || "匿名朋友";
        const m = text.value.trim();
        if (!m) { showToast("先写点什么再发布吧 ✍️"); return; }

        /* ── 内容安全三件套（防捣乱） ── */
        const BANNED = ["赌博", "博彩", "色情", "代开发票", "刷单", "办证", "约炮", "加微信", "加qq", "贷款"];
        const low = m.toLowerCase();
        for (const w of BANNED) {
          if (low.includes(w)) { showToast("留言包含不合适的内容，换个说法吧 🙅"); return; }
        }
        const lastT = Number(localStorage.getItem("gb-lastpost")) || 0;
        const waitSec = Math.ceil((30000 - (Date.now() - lastT)) / 1000);
        if (waitSec > 0) { showToast("发言太频繁啦，" + waitSec + " 秒后再发 🐢"); return; }
        if ((m.match(/https?:\/\//g) || []).length > 2) { showToast("留言里链接太多啦 🙅"); return; }
        try { localStorage.setItem("gb-lastpost", String(Date.now())); } catch (e) {}

        const ok = await postMessage(n, m);
        if (ok) {
          text.value = "";
          $("#gbCount").textContent = "0 / 500";
          try { localStorage.removeItem("gb-draft"); } catch (e) {}
          showToast("留言已上云，所有人可见 ✓");
        } else {
          showToast("云端写入失败（" + lastErr + "），已暂存本机，可点「重新连接」重试");
        }
        updateStatus();
        render(); /* 发布后立即重绘列表 */
      });
    });
  </script>
</body>
</html>
