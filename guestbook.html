<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0e16" />
  <meta name="description" content="留言板 —— 打个招呼，留下你想说的话。" />
  <title>留言板 | CCCAD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💌%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="subpage.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="search.css" />
  <script src="theme.js"></script>
  <script src="search.js"></script>
  <style>
    .gform {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 30px;
      transition: border-color .3s;
    }
    .gform:hover { border-color: var(--border-hover); }

    /* 兔小巢主入口 */
    .txc-hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(120deg, rgba(0, 229, 160, 0.14), rgba(56, 189, 248, 0.10));
      border: 1px solid var(--border-hover);
      border-radius: var(--radius);
      padding: 26px 26px 24px;
      margin-bottom: 36px;
      transition: border-color .3s;
    }
    .txc-hero:hover { border-color: var(--accent); }
    .txc-hero::after {
      content: "";
      position: absolute;
      right: -60px;
      top: -60px;
      width: 230px;
      height: 230px;
      background: radial-gradient(circle, rgba(0, 229, 160, 0.18), transparent 65%);
      pointer-events: none;
    }
    .txc-hero-badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 1px;
      color: var(--accent);
      background: var(--acc-soft-bg);
      border: 1px solid var(--acc-soft-bd);
      border-radius: 999px;
      padding: 3px 12px;
      margin-bottom: 14px;
    }
    .txc-hero-main { display: flex; align-items: center; gap: 16px; }
    .txc-icon { font-size: 2.4rem; flex: none; }
    .txc-text {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .txc-text b { font-size: 1.25rem; }
    .txc-text span { font-size: 0.82rem; color: var(--muted); line-height: 1.7; }
    .txc-btn {
      display: inline-block;
      margin-top: 18px;
      background: var(--gradient);
      color: #06251a;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 10px;
      padding: 12px 34px;
      text-decoration: none;
      transition: transform .2s, box-shadow .2s;
    }
    .txc-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(0, 229, 160, 0.35); }
    /* 备用区隔断线 */
    .backup-h {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 4px 0 18px;
      font-family: var(--mono);
      font-size: 0.74rem;
      letter-spacing: 1px;
      color: var(--muted);
    }
    .backup-h::before, .backup-h::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    @media (max-width: 640px) {
      .txc-hero-main { flex-direction: column; text-align: center; }
      .txc-btn { width: 100%; text-align: center; }
    }
    .gform .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    #gbName {
      flex: 0 0 180px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.88rem;
      padding: 10px 12px;
    }
    #gbName:focus { outline: none; border-color: var(--border-hover); }
    #gbText {
      width: 100%;
      margin: 12px 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      line-height: 1.8;
      padding: 12px 14px;
      resize: vertical;
    }
    #gbText:focus { outline: none; border-color: var(--border-hover); }
    .tbtn {
      background: var(--gradient);
      color: #06251a;
      border: none;
      border-radius: 8px;
      font-size: 0.86rem;
      font-weight: 600;
      font-family: inherit;
      padding: 10px 20px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .tbtn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0, 229, 160, 0.3); }
    .tbtn:disabled { opacity: 0.6; cursor: wait; transform: none; }
    .hint { font-size: 0.74rem; color: var(--muted); font-family: var(--mono); }
    #gbStatus { font-family: var(--mono); font-size: 0.72rem; padding: 3px 10px; border-radius: 999px; }
    #gbStatus.cloud { color: var(--accent); background: var(--acc-soft-bg); border: 1px solid var(--acc-soft-bd); }
    #gbStatus.offline { color: #fbbf24; background: rgba(251, 191, 36, 0.08); border: 1px solid rgba(251, 191, 36, 0.25); }

    .glist { display: flex; flex-direction: column; gap: 14px; }
    .gmsg {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      transition: border-color .3s;
    }
    .gmsg:hover { border-color: var(--border-hover); }
    .gmsg .gh {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .gmsg .who { display: flex; align-items: center; gap: 8px; }
    .gmsg .avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }
    .gmsg .who b { color: var(--accent); font-size: 0.9rem; }
    .gmsg .time { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); }
    .gmsg .gm { color: var(--text); font-size: 0.9rem; line-height: 1.9; word-break: break-word; }
    .chip.owner {
      color: var(--accent);
      background: var(--acc-soft-bg);
      border-color: var(--acc-soft-bd);
    }
  </style>
</head>
<body>

  <div class="top">
    <a class="back" href="index.html">← 返回首页</a>
    <span class="badge">💌 guestbook</span>
  </div>

  <h1>留下你的 <span class="grad">痕迹</span></h1>

  <div class="wrap">

    <!-- 兔小巢主入口：腾讯官方 · 国内直连 · 全员可见 -->
    <div class="txc-hero reveal">
      <span class="txc-hero-badge">🟢 官方推荐 · 国内直连 · 留言全员可见</span>
      <div class="txc-hero-main">
        <span class="txc-icon">💬</span>
        <div class="txc-text">
          <b>兔小巢留言板</b>
          <span>腾讯官方留言服务：QQ / 微信一键登录即可发言，手机电脑都好用，留言所有人可见。</span>
        </div>
      </div>
      <a class="txc-btn" href="https://support.qq.com/products/802123" target="_blank" rel="noopener">🚀 打开留言板</a>
    </div>

    <div class="backup-h">备用 · 本站直连留言板（无需登录）</div>

    <div class="gform reveal">
      <div class="row">
        <input id="gbName" maxlength="30" placeholder="怎么称呼你？（可留空）" />
        <span id="gbStatus" class="offline">📡 连接中…</span>
      </div>
      <textarea id="gbText" rows="3" maxlength="500" placeholder="留下你想说的话……"></textarea>
      <div class="row">
        <button class="tbtn" id="gbPost" type="button">✉️ 发布留言</button>
        <span class="hint" id="gbCount">0 / 500</span>
      </div>
    </div>

    <div class="glist" id="gbList"></div>

  </div>

  <p class="caption">
    <b>推荐使用上方兔小巢留言</b>（腾讯官方 · 国内直连 · 全员可见）｜
    下方备用留言板自动切换数据源：EdgeOne 云接口 → textdb 免注册云库 → Supabase 云库 → 本机暂存
  </p>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const $  = (s, el = document) => el.querySelector(s);
    const $$ = (s, el = document) => [...el.querySelectorAll(s)];
    let toastTimer = null;
    function showToast(msg) {
      const toast = $("#toast");
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
    }
    function initReveal() {
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) { e.target.classList.add("visible"); io.unobserve(e.target); }
        });
      }, { threshold: 0.1 });
      $$(".reveal").forEach((el) => io.observe(el));
    }

    /* ══════════ 数据源：四级自动切换 ══════════
       1) EdgeOne 同源接口 /api/messages（整站部署在 EdgeOne 时可用，国内直连）
       2) textdb.dev 免注册云存储（国内直连，所有访客可见）
       3) Supabase 云数据库（海外网络可达时的备用）
       4) 本机 localStorage（全部失败时的兜底） */
    const TDB_URL = "https://textdb.dev/api/data/cccad-gb-95592aa7";
    const SB_URL = "https://flykgkocxgpcudupgbp.supabase.co";
    const SB_KEY = "sb_publishable_ZhPxj7o-5zD-juN-xI9tFA_113t27GA";
    const SB_HEADERS = {
      apikey: SB_KEY,
      Authorization: "Bearer " + SB_KEY,
      "Content-Type": "application/json",
    };

    let messages = [];   // 当前展示的留言
    let sourceName = ""; // 当前数据源："edgeone" / "supabase" / "local"
    const LKEY = "guestbook-local-fallback";

    function loadLocal() {
      try { return JSON.parse(localStorage.getItem(LKEY) || "null") || []; }
      catch (e) { return []; }
    }
    function saveLocal(list) {
      try { localStorage.setItem(LKEY, JSON.stringify(list)); } catch (e) {}
    }

    function esc(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function fmt(t) {
      return new Date(t).toLocaleString("zh-CN", { hour12: false });
    }
    function avatarFor(n) {
      let h = 0;
      for (const ch of n) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      return ["🌟", "🍀", "🌙", "☕", "🎈", "🐟", "🌸", "⚡"][h % 8];
    }

    function render() {
      $("#gbList").innerHTML = messages.length
        ? messages.map((m) => `
          <div class="gmsg">
            <div class="gh">
              <span class="who">
                <span class="avatar">${avatarFor(m.n)}</span>
                <b>${esc(m.n)}</b>
                ${m.n === "CCCAD" ? '<span class="chip green owner">站长</span>' : ""}
              </span>
              <span class="time">${fmt(m.t)}</span>
            </div>
            <div class="gm">${esc(m.m)}</div>
          </div>`).join("")
        : `<div class="gmsg"><div class="gm">还没有留言，来抢第一个沙发吧！</div></div>`;
    }

    function updateStatus() {
      const s = $("#gbStatus");
      if (sourceName === "edgeone") {
        s.className = "cloud";
        s.textContent = "☁️ 云端已连接（EdgeOne）· 所有访客可见";
      } else if (sourceName === "textdb") {
        s.className = "cloud";
        s.textContent = "☁️ 云端已连接（textdb）· 所有访客可见";
      } else if (sourceName === "supabase") {
        s.className = "cloud";
        s.textContent = "☁️ 云端已连接（Supabase）· 所有访客可见";
      } else {
        s.className = "offline";
        s.textContent = "📴 离线模式 · 留言暂存本机";
      }
    }

    async function tryEdgeOne() {
      const res = await fetch("/api/messages");
      if (!res.ok) throw new Error("HTTP " + res.status);
      const rows = await res.json();
      if (!Array.isArray(rows)) throw new Error("bad payload");
      messages = rows;
      return "edgeone";
    }
    /* textdb 服务端只接受 ASCII 安全的 JSON，中文需转义为 \uXXXX */
    function asciiJson(obj) {
      return JSON.stringify(obj).replace(/[\u0080-\uFFFF]/g, (ch) =>
        "\\u" + ch.charCodeAt(0).toString(16).padStart(4, "0")
      );
    }

    async function tryTextDb() {
      const res = await fetch(TDB_URL);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = JSON.parse(await res.text());
      const rows = Array.isArray(data.messages)
        ? data.messages
        : Array.isArray(data._json)
          ? data._json
          : [];
      messages = rows.slice(-200).reverse(); /* 存储正序，展示最新在前 */
      return "textdb";
    }

    async function trySupabase() {
      const res = await fetch(
        SB_URL + "/rest/v1/messages?select=*&order=created_at.desc&limit=100",
        { headers: SB_HEADERS }
      );
      if (!res.ok) throw new Error("HTTP " + res.status);
      const rows = await res.json();
      messages = rows.map((r) => ({
        n: r.name || "匿名朋友",
        m: r.content,
        t: new Date(r.created_at).getTime(),
      }));
      return "supabase";
    }

    async function refresh() {
      for (const attempt of [tryEdgeOne, tryTextDb, trySupabase]) {
        try {
          sourceName = await attempt();
          saveLocal(messages);
          updateStatus();
          render();
          return;
        } catch (e) { /* 试下一个数据源 */ }
      }
      sourceName = "local";
      messages = loadLocal();
      if (!messages.length) {
        messages = [
          { n: "CCCAD", m: "欢迎来到留言板！想说什么都行，我看到一定回 👋", t: Date.now() - 86400000 },
          { n: "鹈鹕", m: "我骑车路过的，顺便打个招呼 🚲", t: Date.now() - 3600000 },
        ];
      }
      updateStatus();
      render();
    }

    async function postMessage(n, m) {
      $("#gbPost").disabled = true;
      try {
        /* 1) EdgeOne 同源接口 */
        try {
          const res = await fetch("/api/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: n, content: m }),
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const row = await res.json();
          messages.unshift({ n: row.n, m: row.m, t: row.t || Date.now() });
          sourceName = "edgeone";
          saveLocal(messages);
          return true;
        } catch (e) { /* 换下一个 */ }

        /* 2) textdb.dev：读 → 追加 → 整体写回（免注册云存储，国内直连） */
        try {
          let cur = [];
          try {
            const r0 = await fetch(TDB_URL);
            if (r0.ok) {
              const d0 = JSON.parse(await r0.text());
              if (Array.isArray(d0.messages)) cur = d0.messages;
              else if (Array.isArray(d0._json)) cur = d0._json;
            }
          } catch (e) {}
          const next = [...cur, { n: name, m: content, t: Date.now() }].slice(-200);
          const res = await fetch(TDB_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: asciiJson({ messages: next }),
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          messages = next.slice().reverse();
          sourceName = "textdb";
          saveLocal(messages);
          return true;
        } catch (e) { /* 换下一个 */ }

        /* 3) Supabase */
        try {
          const res = await fetch(SB_URL + "/rest/v1/messages", {
            method: "POST",
            headers: { ...SB_HEADERS, Prefer: "return=representation" },
            body: JSON.stringify({ name: n, content: m }),
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const row = (await res.json())[0];
          messages.unshift({ n: row.name, m: row.content, t: new Date(row.created_at).getTime() });
          sourceName = "supabase";
          saveLocal(messages);
          return true;
        } catch (e) { /* 换兜底 */ }

        /* 4) 本机 */
        messages.unshift({ n, m, t: Date.now() });
        sourceName = "local";
        saveLocal(messages);
        return false;
      } finally {
        $("#gbPost").disabled = false;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      initReveal();
      refresh();

      const text = $("#gbText");
      text.addEventListener("input", () => {
        $("#gbCount").textContent = [...text.value].length + " / 500";
      });

      $("#gbPost").addEventListener("click", async () => {
        const n = $("#gbName").value.trim() || "匿名朋友";
        const m = text.value.trim();
        if (!m) { showToast("先写点什么再发布吧 ✍️"); return; }
        const ok = await postMessage(n, m);
        if (ok) {
          text.value = "";
          $("#gbCount").textContent = "0 / 500";
          showToast("留言已上云，所有人可见 ✓");
        } else {
          showToast("连不上云端，留言暂存本机（网络恢复后新留言自动上云）");
        }
        updateStatus();
      });
    });
  </script>
</body>
</html>
